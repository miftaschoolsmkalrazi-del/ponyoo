<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ponyo Booth - Pastel Photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#FFF5F5;--bg2:#FFE8EC;--fg:#4A3F3A;--fg2:#A09088;--accent:#F28B9E;--accent2:#F7B267;--accent3:#8ECAE6;--accent4:#A8D8B9;--card:#FFFFFF;--border:#F5D5DC;--shadow:rgba(200,130,150,.1);--radius:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(circle at 20% 20%,rgba(242,139,158,.06)0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(142,202,230,.06)0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(247,178,103,.04)0%,transparent 50%)}
h1,h2,h3,h4{font-family:'Fredoka',sans-serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* Toast */
.toast-box{position:fixed;top:1rem;right:1rem;z-index:200;display:flex;flex-direction:column;gap:.5rem}
.toast{background:var(--card);border-radius:14px;padding:.65rem 1.1rem;box-shadow:0 8px 30px var(--shadow);border-left:4px solid var(--accent4);font-weight:600;font-size:.82rem;display:flex;align-items:center;gap:.4rem;animation:toastIn .35s ease-out,toastOut .35s 2.4s forwards}
@keyframes toastIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes toastOut{to{transform:translateX(110%);opacity:0}}

/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(60,40,45,.6);z-index:150;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(8px)}
.modal-ov.on{opacity:1;pointer-events:all}
.modal-box{background:var(--card);border-radius:22px;max-width:92vw;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(60,40,45,.2);transform:scale(.92);transition:transform .3s}
.modal-ov.on .modal-box{transform:scale(1)}
.modal-box img{max-width:100%;display:block;border-radius:20px 20px 0 0}
.modal-acts{padding:.8rem;display:flex;justify-content:center;gap:.5rem}

/* Print */
.print-drop{position:fixed;inset:0;z-index:140;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .3s}
.print-drop.on{opacity:1}
.print-drop .print-img{border-radius:6px;box-shadow:0 12px 50px rgba(60,40,45,.3);animation:printSlide 1.8s cubic-bezier(.22,1,.36,1) forwards;max-width:80vw;max-height:75vh;object-fit:contain}
@keyframes printSlide{0%{transform:translateY(-100vh) rotate(-2deg);opacity:0}15%{opacity:1}70%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(20px);opacity:0}}

/* Confetti */
#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:100}

/* Screens */
.screen{position:relative;z-index:10;max-width:600px;margin:0 auto;padding:1.5rem 1rem 3rem;transition:opacity .45s,transform .45s}
.screen.hide{opacity:0;transform:translateY(-25px);pointer-events:none;position:absolute;left:50%;transform:translateX(-50%) translateY(-25px)}

/* Header */
.tpl-header{text-align:center;margin-bottom:1.8rem}
.tpl-header h1{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.tpl-header p{color:var(--fg2);font-size:.92rem;margin-top:.3rem;font-weight:500}

/* Sections */
.sec{margin-bottom:1.4rem}
.sec-label{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.88rem;margin-bottom:.6rem;display:flex;align-items:center;gap:.4rem;color:var(--fg)}
.sec-label i{color:var(--accent);font-size:.78rem}

/* Frame scroll */
.frame-scroll{display:flex;gap:.6rem;overflow-x:auto;padding-bottom:.5rem;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.frame-scroll::-webkit-scrollbar{height:3px}
.frame-card{min-width:96px;max-width:96px;background:var(--card);border:2.5px solid var(--border);border-radius:16px;padding:.45rem;cursor:pointer;transition:all .25s;scroll-snap-align:start;flex-shrink:0;text-align:center;position:relative;overflow:hidden}
.frame-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px var(--shadow)}
.frame-card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,139,158,.15)}
.frame-card.sel::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:5px;right:6px;font-size:.5rem;background:var(--accent);color:#fff;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.frame-mini{width:100%;aspect-ratio:3/4;border-radius:10px;overflow:hidden;margin-bottom:.3rem;background:linear-gradient(135deg,#FFE8EC,#F5D5DC)}
.frame-mini canvas{width:100%;height:100%;display:block}
.frame-nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.68rem;color:var(--fg)}

/* Template grid */
.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.tpl-card{background:var(--card);border:2.5px solid var(--border);border-radius:16px;padding:.5rem;cursor:pointer;transition:all .25s;text-align:center;position:relative;overflow:hidden}
.tpl-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px var(--shadow)}
.tpl-card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,139,158,.15)}
.tpl-card.sel::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:5px;right:6px;font-size:.5rem;background:var(--accent);color:#fff;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tpl-mini{width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;margin-bottom:.3rem;background:linear-gradient(135deg,#FFE8EC,#F5D5DC)}
.tpl-mini canvas{width:100%;height:100%;display:block}
.tpl-nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.72rem}
.tpl-desc{font-size:.6rem;color:var(--fg2);margin-top:.1rem}

/* Custom panel */
.custom-panel{background:var(--card);border-radius:18px;padding:.85rem 1rem;box-shadow:0 4px 20px var(--shadow);border:2px solid var(--border);margin-bottom:1rem}
.custom-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem;font-size:.8rem;font-weight:600;color:var(--fg2)}
.custom-row:last-child{margin-bottom:0}
.custom-row label{min-width:60px;font-size:.73rem}
.custom-row input[type=range]{flex:1;accent-color:var(--accent);height:4px}
.custom-row input[type=color]{width:32px;height:26px;border:2px solid var(--border);border-radius:8px;cursor:pointer;padding:0;background:none}
.custom-row input[type=text]{flex:1;border:2px solid var(--border);border-radius:10px;padding:.35rem .7rem;font-family:'Quicksand',sans-serif;font-weight:600;font-size:.78rem;color:var(--fg);outline:none;transition:border-color .2s;background:var(--bg)}
.custom-row input[type=text]:focus{border-color:var(--accent)}
.custom-row span{min-width:48px;text-align:right;font-size:.7rem;font-variant-numeric:tabular-nums}

/* Button go */
.btn-go{font-family:'Fredoka',sans-serif;font-weight:700;border:none;cursor:pointer;border-radius:50px;padding:.95rem 2.5rem;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:.5rem;margin:1.5rem auto 0;background:linear-gradient(135deg,var(--accent),#F5A0B5,var(--accent2));color:#fff;box-shadow:0 6px 28px rgba(242,139,158,.35);transition:all .25s;width:100%;max-width:300px}
.btn-go:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(242,139,158,.45)}
.btn-go:active{transform:scale(.97)}

/* Camera screen */
.cam-screen{position:relative;z-index:10;transition:opacity .45s,transform .45s}
.cam-screen.hide{opacity:0;transform:translateY(25px);pointer-events:none;position:absolute;left:0;right:0}
.cam-top{text-align:center;padding:.8rem 1rem .2rem;display:flex;align-items:center;justify-content:center;gap:.6rem}
.cam-top h2{font-size:1.05rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.btn-bk{background:var(--card);border:2px solid var(--border);color:var(--fg);border-radius:12px;padding:.3rem .7rem;cursor:pointer;font-size:.73rem;font-family:'Quicksand',sans-serif;font-weight:700;transition:all .2s;display:flex;align-items:center;gap:.25rem}
.btn-bk:hover{border-color:var(--accent);color:var(--accent)}
.info-pill{display:inline-flex;align-items:center;gap:.3rem;background:rgba(242,139,158,.1);border:1px solid rgba(242,139,158,.2);border-radius:20px;padding:.2rem .65rem;font-size:.63rem;font-weight:700;color:var(--accent);font-family:'Fredoka',sans-serif}

.cam-wrap{max-width:680px;margin:.4rem auto;padding:0 1rem}
.cam-frame{position:relative;background:var(--card);border-radius:22px;box-shadow:0 6px 40px var(--shadow),0 0 0 2.5px var(--border);overflow:hidden;aspect-ratio:4/3}
.cam-frame video,.cam-frame canvas{width:100%;height:100%;object-fit:cover;display:block}
.cam-frame canvas{position:absolute;top:0;left:0;pointer-events:none}

.cd-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,245,245,.4);backdrop-filter:blur(3px);z-index:20;opacity:0;pointer-events:none;transition:opacity .15s}
.cd-ov.on{opacity:1}
.cd-num{font-family:'Fredoka',sans-serif;font-size:6rem;font-weight:700;color:var(--accent);text-shadow:0 3px 20px rgba(242,139,158,.3);animation:cdPop .55s ease-out}
.cd-sub{font-family:'Fredoka',sans-serif;font-size:.95rem;color:var(--fg2);margin-top:.2rem;font-weight:600}
@keyframes cdPop{0%{transform:scale(2.2);opacity:0}50%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
.flash-ov{position:absolute;inset:0;background:#fff;z-index:25;opacity:0;pointer-events:none;transition:opacity .12s}
.flash-ov.on{opacity:.85;transition:opacity 0s}
.cam-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:linear-gradient(135deg,#FFF5F5,#FFE8EC);z-index:5}
.cam-ph i{font-size:3rem;color:var(--accent);animation:bIc 2s ease-in-out infinite}
@keyframes bIc{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.ctrls{max-width:680px;margin:.6rem auto;padding:0 1rem;display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap}
.btn{font-family:'Fredoka',sans-serif;font-weight:600;border:none;cursor:pointer;border-radius:14px;padding:.6rem 1.2rem;font-size:.85rem;display:inline-flex;align-items:center;gap:.4rem;transition:all .22s}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-cap{background:linear-gradient(135deg,var(--accent),#F5A0B5);color:#fff;font-size:1rem;padding:.75rem 1.8rem;border-radius:50px;box-shadow:0 4px 22px rgba(242,139,158,.35)}
.btn-cap:hover:not(:disabled){box-shadow:0 6px 30px rgba(242,139,158,.5);transform:translateY(-2px)}
.btn-fl{background:var(--card);color:var(--fg);border:2px solid var(--border)}
.btn-fl:hover{border-color:var(--accent);color:var(--accent)}

.panels{max-width:680px;margin:.3rem auto 2rem;padding:0 1rem;display:flex;flex-direction:column;gap:.6rem}
.pnl{background:var(--card);border-radius:18px;padding:.8rem 1rem;box-shadow:0 4px 20px var(--shadow);border:2px solid var(--border)}
.pnl-t{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.82rem;color:var(--fg2);margin-bottom:.45rem;display:flex;align-items:center;gap:.4rem}
.pnl-t i{color:var(--accent);font-size:.75rem}
.tm-row{display:flex;align-items:center;gap:.7rem;font-size:.78rem;font-weight:600;color:var(--fg2)}
.tm-row input[type=range]{flex:1;accent-color:var(--accent);height:5px}

.fl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:.4rem}
.fl-item{text-align:center;cursor:pointer;border-radius:12px;padding:.25rem .15rem;transition:all .2s;border:2px solid transparent}
.fl-item:hover{background:var(--bg2)}
.fl-item.on{border-color:var(--accent);background:rgba(242,139,158,.06)}
.fl-prev{width:48px;height:36px;border-radius:8px;margin:0 auto .25rem;overflow:hidden;background:linear-gradient(135deg,#FFE0E8,#F5C8D4);position:relative}
.fl-prev::after{content:'';position:absolute;inset:0;border-radius:8px}
.fl-item[data-f="none"] .fl-prev::after{background:transparent}
.fl-item[data-f="grayscale"] .fl-prev::after{background:grayscale(100%);mix-blend-mode:multiply}
.fl-item[data-f="sepia"] .fl-prev::after{background:sepia(80%);mix-blend-mode:multiply}
.fl-item[data-f="warm"] .fl-prev::after{background:linear-gradient(135deg,rgba(255,165,0,.3),rgba(255,69,0,.15))}
.fl-item[data-f="cool"] .fl-prev::after{background:linear-gradient(135deg,rgba(0,191,255,.25),rgba(0,0,139,.15))}
.fl-item[data-f="vintage"] .fl-prev::after{background:linear-gradient(135deg,rgba(210,180,140,.35),rgba(139,90,43,.15))}
.fl-item[data-f="pop"] .fl-prev::after{background:linear-gradient(135deg,rgba(255,0,128,.2),rgba(255,255,0,.2))}
.fl-item[data-f="bw"] .fl-prev::after{background:grayscale(100%) contrast(1.3);mix-blend-mode:multiply}
.fl-item[data-f="invert"] .fl-prev::after{background:invert(100%);mix-blend-mode:multiply}
.fl-item[data-f="fade"] .fl-prev::after{background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3))}
.fl-nm{font-size:.6rem;font-weight:600;color:var(--fg)}

/* Gallery */
.gal-sec{max-width:680px;margin:0 auto 3rem;padding:0 1rem}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem}
.gal-item{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px var(--shadow);border:2px solid var(--border);cursor:pointer;transition:all .25s}
.gal-item:hover{transform:translateY(-3px);box-shadow:0 8px 28px var(--shadow)}
.gal-item img{width:100%;display:block}
.gal-acts{position:absolute;bottom:0;left:0;right:0;padding:.35rem;display:flex;gap:.25rem;background:linear-gradient(transparent,rgba(60,40,45,.5));opacity:0;transition:opacity .2s}
.gal-item:hover .gal-acts{opacity:1}
.gal-acts button{flex:1;padding:.3rem;border:none;border-radius:8px;font-size:.68rem;font-weight:600;cursor:pointer;font-family:'Quicksand',sans-serif;display:flex;align-items:center;justify-content:center;gap:.2rem}
.g-dl{background:var(--accent);color:#fff}
.g-del{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(3px)}

/* Floating deco */
.float-d{position:fixed;pointer-events:none;z-index:1;opacity:.06;font-size:1.8rem;animation:fA 22s linear infinite}
@keyframes fA{0%{transform:translateY(100vh) rotate(0)}100%{transform:translateY(-10vh) rotate(360deg)}}

footer{text-align:center;padding:1rem .8rem 1.5rem;color:var(--fg2);font-size:.72rem;position:relative;z-index:10;font-weight:500}
footer i{color:var(--accent)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:640px){.fl-grid{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}.gal-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.btn-cap{padding:.65rem 1.4rem;font-size:.9rem}.tpl-grid{grid-template-columns:repeat(2,1fr)}.frame-card{min-width:82px;max-width:82px}.cd-num{font-size:4.5rem}}
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>
<div class="toast-box" id="toastBox"></div>

<div class="modal-ov" id="modal" role="dialog" aria-label="Preview foto">
<div class="modal-box">
<img id="modalImg" src="" alt="Preview">
<div class="modal-acts">
<button class="btn btn-cap" onclick="dlModal()" style="font-size:.8rem;padding:.5rem 1.2rem"><i class="fa-solid fa-download"></i> Download</button>
<button class="btn btn-fl" onclick="closeModal()" style="font-size:.8rem"><i class="fa-solid fa-xmark"></i> Tutup</button>
</div>
</div>
</div>

<div class="print-drop" id="printDrop"><img class="print-img" id="printImg" src="" alt=""></div>

<div class="float-d" style="left:5%;animation-delay:0s">&#10024;</div>
<div class="float-d" style="left:30%;animation-delay:6s;font-size:1.3rem">&#127800;</div>
<div class="float-d" style="left:55%;animation-delay:11s">&#9733;</div>
<div class="float-d" style="left:78%;animation-delay:14s;font-size:1.5rem">&#127801;</div>
<div class="float-d" style="left:94%;animation-delay:8s">&#10047;</div>

<!-- ===== SELECTION ===== -->
<section class="screen" id="scrTpl">
<div class="tpl-header">
<h1>Ponyo Booth</h1>
<p>Pilih frame dan template favoritmu, lalu mulai foto!</p>
</div>

<div class="sec">
<div class="sec-label"><i class="fa-solid fa-palette"></i> Pilih Frame</div>
<div class="frame-scroll" id="frameScroll"></div>
</div>

<div class="sec">
<div class="sec-label"><i class="fa-solid fa-table-cells"></i> Pilih Template</div>
<div class="tpl-grid" id="tplGrid"></div>
</div>

<div class="sec">
<div class="sec-label"><i class="fa-solid fa-sliders"></i> Kustomisasi Frame</div>
<div class="custom-panel">
<div class="custom-row"><label>Warna</label><input type="color" id="cFrameColor" value="#FFFFFF" oninput="updateFrameCustom()"><span id="cColorVal">#FFFFFF</span></div>
<div class="custom-row"><label>Opacity</label><input type="range" id="cFrameOpacity" min="0" max="100" value="80" oninput="updateFrameCustom()"><span id="cOpacityVal">80%</span></div>
<div class="custom-row"><label>Corner</label><input type="range" id="cFrameCorner" min="0" max="40" value="14" oninput="updateFrameCustom()"><span id="cCornerVal">14px</span></div>
<div class="custom-row"><label>Glow</label><input type="range" id="cFrameGlow" min="0" max="30" value="0" oninput="updateFrameCustom()"><span id="cGlowVal">0</span></div>
<div class="custom-row"><label>Teks</label><input type="text" id="cFrameText" placeholder="Teks di frame..." maxlength="30" oninput="updateFrameCustom()"></div>
</div>
</div>

<button class="btn-go" onclick="startSession()"><i class="fa-solid fa-camera"></i> Mulai Foto</button>
</section>

<!-- ===== CAMERA ===== -->
<section class="cam-screen hide" id="scrCam">
<div class="cam-top">
<button class="btn-bk" onclick="backToTpl()"><i class="fa-solid fa-arrow-left"></i> Ubah</button>
<h2>Ponyo Booth</h2>
<span class="info-pill" id="infoPill"></span>
</div>
<div class="cam-wrap">
<div class="cam-frame" id="camFrame">
<video id="video" autoplay playsinline muted style="transform:scaleX(-1)"></video>
<canvas id="frameOverlay" style="transform:scaleX(-1);z-index:10"></canvas>
<div class="cam-ph" id="camPh"><i class="fa-solid fa-camera-retro"></i><p style="color:var(--fg2);font-weight:600;font-size:.85rem">Memulai kamera...</p></div>
<div class="cd-ov" id="cdOv"><span class="cd-num" id="cdNum">3</span><span class="cd-sub" id="cdSub"></span></div>
<div class="flash-ov" id="flashOv"></div>
</div>
</div>
<div class="ctrls">
<button class="btn btn-cap" id="btnCap" onclick="handleCap()"><i class="fa-solid fa-camera"></i> <span id="capTxt">Ambil Foto</span></button>
<button class="btn btn-fl" onclick="flipCam()"><i class="fa-solid fa-arrows-rotate"></i> Balik</button>
</div>
<div class="panels">
<div class="pnl"><div class="pnl-t"><i class="fa-solid fa-clock"></i> Timer</div>
<div class="tm-row"><span>Langsung</span><input type="range" id="timerSlider" min="0" max="5" value="3" step="1" oninput="updTimerLbl()"><span id="timerLbl">3 detik</span></div></div>
<div class="pnl"><div class="pnl-t"><i class="fa-solid fa-wand-magic-sparkles"></i> Filter</div><div class="fl-grid" id="flGrid"></div></div>
</div>
<div class="gal-sec" id="galSec" style="display:none"><div class="pnl"><div class="pnl-t"><i class="fa-solid fa-images"></i> Galeri Foto</div><div class="gal-grid" id="galGrid"></div></div></div>
</section>

<footer>Dibuat dengan <i class="fa-solid fa-heart"></i> Ponyo Booth</footer>

<script>
/* ====== STATE ====== */
let stream=null,currentFilter='none',photos=[],facingMode='user',isFlipped=true,isCapturing=false,multiImgs=[];
let selFrame='cute',selTpl='grid2x2';
let frameCustom={color:'#FFFFFF',opacity:80,corner:14,glow:0,text:''};
const video=document.getElementById('video');
const frameOv=document.getElementById('frameOverlay');
const fCtx=frameOv.getContext('2d');
const camFrame=document.getElementById('camFrame');
const camPh=document.getElementById('camPh');

/* ====== FRAME DEFINITIONS ====== */
const frameDefs=[
{id:'cute',name:'Cute',accent:'#FFB6C1',bg1:'#FFF0F5',bg2:'#FFE4EC',dark:false},
{id:'elegant',name:'Elegant',accent:'#C9A96E',bg1:'#FFFEF8',bg2:'#FFF8EC',dark:false},

/* ====== AUDIO ====== */
let audioCtx=null;
function getAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playBeep(){try{const a=getAC(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.start(a.currentTime);o.stop(a.currentTime+.12);}catch(e){}}
function playShutter(){try{const a=getAC(),l=a.sampleRate*.08,b=a.createBuffer(1,l,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,4);const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.setValueAtTime(.18,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.08);const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2200;f.Q.value=.8;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime);}catch(e){}}
function playPrint(){try{const a=getAC();const dur=.6,l=a.sampleRate*dur,b=a.createBuffer(1,l,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<l;i++){const t=i/a.sampleRate;d[i]=(Math.random()*2-1)*.07*Math.exp(-t*8)*Math.abs(Math.sin(t*40));}const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.value=.12;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=800;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime);}catch(e){}}
function playDone(){try{const a=getAC();[523,659,784].forEach((fr,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=fr;o.type='sine';const t=a.currentTime+i*.1;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.start(t);o.stop(t+.15);});}catch(e){}}

/* ====== ROUNDED RECT ====== */
function rRect(ctx,x,y,w,h,r){
    w=Math.max(0,w);h=Math.max(0,h);r=Math.min(Math.max(0,r),w/2,h/2);
    ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

/* ====== DRAW FRAME ON CANVAS ====== */
function drawFrameOnCanvas(ctx,w,h,frameId,fc){
    const def=frameDefs.find(f=>f.id===frameId);
    if(!def)return;
    const op=(fc?.opacity||80)/100;
    const cr=fc?.corner||14;
    const glow=fc?.glow||0;
    const color=fc?.color||def.accent;
    ctx.save();ctx.globalAlpha=op;
    if(glow>0){ctx.shadowColor=color;ctx.shadowBlur=glow;}

    if(frameId==='cute'){
        const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#FFF0F5');g.addColorStop(1,'#FFE4EC');ctx.fillStyle=g;rRect(ctx,0,0,w,h,cr);ctx.fill();
        ctx.strokeStyle='#FFB6C1';ctx.lineWidth=3;rRect(ctx,5,5,w-10,h-10,Math.max(0,cr-2));ctx.stroke();
        ctx.setLineDash([6,4]);ctx.strokeStyle='#FFD1DC';ctx.lineWidth=1.5;rRect(ctx,12,12,w-24,h-24,Math.max(0,cr-4));ctx.stroke();ctx.setLineDash([]);
    }
    else if(frameId==='elegant'){
        const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#FFFEF8');g.addColorStop(1,'#FFF8EC');ctx.fillStyle=g;rRect(ctx,0,0,w,h,cr);ctx.fill();
        ctx.strokeStyle='#C9A96E';ctx.lineWidth=2;rRect(ctx,4,4,w-8,h-8,Math.max(0,cr-1));ctx.stroke();
        ctx.strokeStyle='rgba(201,169,110,.25)';ctx.lineWidth=1;rRect(ctx,10,10,w-20,h-20,Math.max(0,cr-3));ctx.stroke();
    }
    else if(frameId==='minimal'){
        ctx.fillStyle='#FFFFFF';rRect(ctx,0,0,w,h,cr);ctx.fill();
        ctx.strokeStyle='#D4B8C0';ctx.lineWidth=1.5;rRect(ctx,4,4,w-8,h-8,Math.max(0,cr-1));ctx.stroke();
    }
    else if(frameId==='vintage'){
        const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#FFF8F0');g.addColorStop(1,'#F5EDE0');ctx.fillStyle=g;rRect(ctx,0,0,w,h,cr);ctx.fill();
        ctx.strokeStyle='#A0856E';ctx.lineWidth=2.5;rRect(ctx,4,4,w-8,h-8,Math.max(0,cr-1));ctx.stroke();
        ctx.strokeStyle='rgba(160,133,110,.2)';ctx.lineWidth=1;rRect(ctx,10,10,w-20,h-20,Math.max(0,cr-3));ctx.stroke();
    }
    else if(frameId==='pastel'){
        const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#F0F4FF');g.addColorStop(1,'#E8F0FE');ctx.fillStyle=g;rRect(ctx,0,0,w,h,cr);ctx.fill();
        ctx.strokeStyle='#B8D4E3';ctx.lineWidth=2;rRect(ctx,5,5,w-10,h-10,Math.max(0,cr-2));ctx.stroke();
    }
    else if(frameId==='soft'){
        const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#FAF5FF');g.addColorStop(1,'#F0E8FE');ctx.fillStyle=g;rRect(ctx,0,0,w,h,cr);ctx.fill();
        ctx.strokeStyle='#D4C4F0';ctx.lineWidth=2;rRect(ctx,5,5,w-10,h-10,Math.max(0,cr-2));ctx.stroke();
        ctx.strokeStyle='rgba(212,196,240,.3)';ctx.lineWidth=1;rRect(ctx,11,11,w-22,h-22,Math.max(0,cr-4));ctx.stroke();
    }
    else if(frameId==='y2k'){
        const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#FFF0F8');g.addColorStop(1,'#FFE0F0');ctx.fillStyle=g;rRect(ctx,0,0,w,h,cr);ctx.fill();
        ctx.strokeStyle='#FF69B4';ctx.lineWidth=3;rRect(ctx,5,5,w-10,h-10,Math.max(0,cr-2));ctx.stroke();
        ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(255,105,180,.35)';ctx.lineWidth=1;rRect(ctx,12,12,w-24,h-24,Math.max(0,cr-4));ctx.stroke();ctx.setLineDash([]);
    }
    else if(frameId==='korean'){
        const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#FFF5F5');g.addColorStop(1,'#FFE8E8');ctx.fillStyle=g;rRect(ctx,0,0,w,h,cr);ctx.fill();
        ctx.strokeStyle='#FFD4D4';ctx.lineWidth=2;rRect(ctx,6,6,w-12,h-12,Math.max(0,cr-2));ctx.stroke();
    }
    else if(frameId==='purikura'){
        const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#FFF0F6');g.addColorStop(1,'#FFE0EE');ctx.fillStyle=g;rRect(ctx,0,0,w,h,cr);ctx.fill();
        ctx.strokeStyle='#FF7EB3';ctx.lineWidth=2.5;rRect(ctx,5,5,w-10,h-10,Math.max(0,cr-2));ctx.stroke();
        ctx.strokeStyle='rgba(255,126,179,.25)';ctx.lineWidth=1;rRect(ctx,11,11,w-22,h-22,Math.max(0,cr-4));ctx.stroke();
    }
    else if(frameId==='polaroid'){
        ctx.fillStyle='#FAFAFA';rRect(ctx,0,0,w,h,Math.max(0,cr-4));ctx.fill();
        ctx.strokeStyle='#E0DCD6';ctx.lineWidth=1.5;rRect(ctx,2,2,w-4,h-4,Math.max(0,cr-5));ctx.stroke();
        const m=Math.max(w,h)*.06;ctx.fillStyle='#F0ECE6';ctx.fillRect(m,h-m*5,w-m*2,m*4.5);
    }
    else if(frameId==='film'){
        ctx.fillStyle='#1A1815';rRect(ctx,0,0,w,h,cr);ctx.fill();
        ctx.strokeStyle='#3A3530';ctx.lineWidth=2;rRect(ctx,3,3,w-6,h-6,Math.max(0,cr-1));ctx.stroke();
        ctx.fillStyle='#3A3530';const s=Math.max(8,w*.02);
        for(let y=s;y<h-s;y+=s*2.5){for(let x=s;x<w*.08;x+=s*1.8){rRect(ctx,x,y,s*1.4,s*1.8,2);ctx.fill();}for(let x=w-w*.08-s*1.4;x>w-w*.08-s;x-=s*1.8){rRect(ctx,x,y,s*1.4,s*1.8,2);ctx.fill();}}
    }
    else if(frameId==='cyber'){
        const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#0A0A1A');g.addColorStop(1,'#151530');ctx.fillStyle=g;rRect(ctx,0,0,w,h,cr);ctx.fill();
        ctx.strokeStyle='#00FFFF';ctx.lineWidth=2;rRect(ctx,5,5,w-10,h-10,Math.max(0,cr-2));ctx.stroke();
        ctx.strokeStyle='rgba(0,255,255,.2)';ctx.lineWidth=1;rRect(ctx,12,12,w-24,h-24,Math.max(0,cr-4));ctx.stroke();
    }
    else if(frameId==='bokeh'){
        const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1A0A2E');g.addColorStop(1,'#0D0520');ctx.fillStyle=g;rRect(ctx,0,0,w,h,cr);ctx.fill();
        const cols=['rgba(255,215,0,.18)','rgba(255,105,180,.12)','rgba(0,206,209,.12)','rgba(255,99,71,.1)','rgba(135,206,235,.1)'];
        for(let i=0;i<18;i++){ctx.beginPath();ctx.arc(Math.random()*w,Math.random()*h,Math.random()*w*.04+w*.01,0,Math.PI*2);ctx.fillStyle=cols[i%cols.length];ctx.fill();}
        ctx.strokeStyle='rgba(255,215,0,.25)';ctx.lineWidth=1.5;rRect(ctx,6,6,w-12,h-12,Math.max(0,cr-2));ctx.stroke();
    }
    else if(frameId==='neon'){
        ctx.fillStyle='#0A0A0A';rRect(ctx,0,0,w,h,cr);ctx.fill();
        ctx.shadowColor='#39FF14';ctx.shadowBlur=12;ctx.strokeStyle='#39FF14';ctx.lineWidth=2;rRect(ctx,6,6,w-12,h-12,Math.max(0,cr-2));ctx.stroke();
        ctx.shadowBlur=0;ctx.strokeStyle='rgba(57,255,20,.2)';ctx.lineWidth=1;rRect(ctx,14,14,w-28,h-28,Math.max(0,cr-4));ctx.stroke();
    }
    else if(frameId==='galaxy'){
        const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1A0533');g.addColorStop(1,'#0D0220');ctx.fillStyle=g;rRect(ctx,0,0,w,h,cr);ctx.fill();
        for(let i=0;i<35;i++){ctx.beginPath();ctx.arc(Math.random()*w,Math.random()*h,Math.random()*2+.5,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${Math.random()*.4+.1})`;ctx.fill();}
        ctx.strokeStyle='rgba(155,89,182,.35)';ctx.lineWidth=1.5;rRect(ctx,6,6,w-12,h-12,Math.max(0,cr-2));ctx.stroke();
    }
    ctx.restore();
}

/* ====== BUILD FRAME SELECTION ====== */
function buildFrameScroll(){
    const sc=document.getElementById('frameScroll');sc.innerHTML='';
    frameDefs.forEach(f=>{
        const card=document.createElement('div');
        card.className='frame-card'+(f.id===selFrame?' sel':'');
        card.dataset.fid=f.id;
        card.onclick=()=>{selFrame=f.id;document.querySelectorAll('.frame-card').forEach(c=>c.classList.toggle('sel',c.dataset.fid===f.id));drawTplPreviews();};
        card.innerHTML=`<div class="frame-mini"><canvas id="fm_${f.id}"></canvas></div><div class="frame-nm">${f.name}</div>`;
        sc.appendChild(card);
    });
    setTimeout(()=>{frameDefs.forEach(f=>{const c=document.getElementById('fm_'+f.id);if(!c)return;c.width=120;c.height=160;const x=c.getContext('2d');
        x.fillStyle=f.dark?'#2A2520':'#F0EAE2';rRect(x,0,0,120,160,8);x.fill();
        drawFrameOnCanvas(x,120,160,f.id,frameCustom);
        x.fillStyle=f.dark?'rgba(255,255,255,.35)':'rgba(0,0,0,.12)';x.font='26px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('\u{1F4F7}',60,80);
    });},50);
}

/* ====== BUILD TEMPLATE SELECTION ====== */
function buildTplGrid(){
    const g=document.getElementById('tplGrid');g.innerHTML='';
    tplDefs.forEach(t=>{
        const card=document.createElement('div');
        card.className='tpl-card'+(t.id===selTpl?' sel':'');
        card.dataset.tid=t.id;
        card.onclick=()=>{selTpl=t.id;document.querySelectorAll('.tpl-card').forEach(c=>c.classList.toggle('sel',c.dataset.tid===t.id));};
        card.innerHTML=`<div class="tpl-mini"><canvas id="tm_${t.id}"></canvas></div><div class="tpl-nm">${t.name}</div><div class="tpl-desc">${t.desc}</div>`;
        g.appendChild(card);
    });
    setTimeout(drawTplPreviews,50);
}

function drawTplPreviews(){
    tplDefs.forEach(t=>{
        const c=document.getElementById('tm_'+t.id);if(!c)return;c.width=140;c.height=140;
        const x=c.getContext('2d');const def=frameDefs.find(f=>f.id===selFrame);
        x.fillStyle=def?.dark?'#2A2520':'#F0EAE2';rRect(x,0,0,140,140,8);x.fill();
        drawFrameOnCanvas(x,140,140,selFrame,frameCustom);
        x.fillStyle=def?.dark?'rgba(255,255,255,.3)':'rgba(0,0,0,.1)';x.font='15px serif';x.textAlign='center';x.textBaseline='middle';
        if(t.id==='grid2x2'){for(let r=0;r<2;r++)for(let col=0;col<2;col++)x.fillText('\u{1F4F7}',35+col*70,45+r*50);}
        else if(t.id==='strip'){for(let i=0;i<4;i++)x.fillText('\u{1F4F7}',25+i*30,70);}
        else if(t.id==='polaroid'){x.fillText('\u{1F4F7}',70,55);}
        else if(t.id==='korean'){x.fillText('\u{1F4F7}',50,60);x.fillText('\u{1F4F7}',100,80);}
        else if(t.id==='purikura'){for(let i=0;i<3;i++)x.fillText('\u{1F4F7}',30+i*45,70);}
    });
}

/* ====== FRAME CUSTOM UPDATE ====== */
function updateFrameCustom(){
    frameCustom.color=document.getElementById('cFrameColor').value;
    frameCustom.opacity=parseInt(document.getElementById('cFrameOpacity').value);
    frameCustom.corner=parseInt(document.getElementById('cFrameCorner').value);
    frameCustom.glow=parseInt(document.getElementById('cFrameGlow').value);
    frameCustom.text=document.getElementById('cFrameText').value;
    document.getElementById('cColorVal').textContent=frameCustom.color;
    document.getElementById('cOpacityVal').textContent=frameCustom.opacity+'%';
    document.getElementById('cCornerVal').textContent=frameCustom.corner+'px';
    document.getElementById('cGlowVal').textContent=frameCustom.glow;
    // Redraw mini previews
    frameDefs.forEach(f=>{const c=document.getElementById('fm_'+f.id);if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);
        x.fillStyle=f.dark?'#2A2520':'#F0EAE2';rRect(x,0,0,c.width,c.height,8);x.fill();
        drawFrameOnCanvas(x,c.width,c.height,f.id,frameCustom);
        x.fillStyle=f.dark?'rgba(255,255,255,.35)':'rgba(0,0,0,.12)';x.font='26px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('\u{1F4F7}',c.width/2,c.height/2);
    });
    drawTplPreviews();
}

/* ====== START SESSION ====== */
function startSession(){
    const tDef=tplDefs.find(t=>t.id===selTpl);
    const fDef=frameDefs.find(f=>f.id===selFrame);
    document.getElementById('infoPill').innerHTML=`<i class="fa-solid fa-table-cells" style="font-size:.5rem"></i> ${tDef.name} &middot; ${fDef.name}`;
    document.getElementById('scrTpl').classList.add('hide');
    setTimeout(()=>{document.getElementById('scrCam').classList.remove('hide');startCamera();},300);
}

function backToTpl(){
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    multiImgs=[];
    document.getElementById('scrCam').classList.add('hide');
    setTimeout(()=>{document.getElementById('scrTpl').classList.remove('hide');},300);
}

/* ====== CAMERA ====== */
async function startCamera(){
    try{
        stream=await navigator.mediaDevices.getUserMedia({video:{facingMode,width:{ideal:1280},height:{ideal:960}},audio:false});
        video.srcObject=stream;await video.play();
        camPh.style.display='none';
        resizeCanvases();
        window.addEventListener('resize',resizeCanvases);
        showToast('Kamera aktif!','fa-solid fa-check');
    }catch(e){showToast('Gagal akses kamera: '+e.message,'fa-solid fa-triangle-exclamation');}
}

function resizeCanvases(){
    const vw=video.videoWidth||640,vh=video.videoHeight||480;
    frameOv.width=vw;frameOv.height=vh;
    drawFrameOverlay();
}

function drawFrameOverlay(){
    const w=frameOv.width,h=frameOv.height;
    fCtx.clearRect(0,0,w,h);
    drawFrameOnCanvas(fCtx,w,h,selFrame,frameCustom);
    if(frameCustom.text){
        fCtx.save();fCtx.globalAlpha=(frameCustom.opacity||80)/100;
        const fs=Math.round(w*.04);
        fCtx.font=`bold ${fs}px Fredoka,sans-serif`;
        fCtx.textAlign='center';fCtx.textBaseline='top';
        const isDark=frameDefs.find(f=>f.id===selFrame)?.dark;
        fCtx.fillStyle=isDark?'#FFFFFF':'#4A3F3A';
        fCtx.shadowColor=isDark?'rgba(255,255,255,.3)':'rgba(0,0,0,.15)';fCtx.shadowBlur=4;
        fCtx.fillText(frameCustom.text,w/2,h*.03);
        fCtx.restore();
    }
}

function flipCam(){
    facingMode=facingMode==='user'?'environment':'user';
    isFlipped=facingMode==='user';
    video.style.transform=`scaleX(${isFlipped?'-1':'1'})`;
    frameOv.style.transform=`scaleX(${isFlipped?'-1':'1'})`;
    if(stream)stream.getTracks().forEach(t=>t.stop());
    startCamera();
}

async function handleCap(){if(!stream||isCapturing)return;await multiShotCap();}

async function multiShotCap(){
    isCapturing=true;document.getElementById('btnCap').disabled=true;multiImgs=[];
    const tv=parseInt(document.getElementById('timerSlider').value);
    const tDef=tplDefs.find(t=>t.id===selTpl);
    const total=tDef.shots;
    for(let i=0;i<total;i++){
        document.getElementById('capTxt').textContent=`${i+1} / ${total}`;
        await runCd(tv,`Foto ${i+1} dari ${total}`);
        playShutter();flashFx();
        multiImgs.push(captureRaw());
        if(i<total-1)await sleep(400);
    }
    document.getElementById('capTxt').textContent='Ambil Foto';
    const finalUrl=assembleResult(multiImgs);
    photos.push({url:finalUrl});
    playPrint();
    showPrintAnimation(finalUrl);
    setTimeout(()=>{playDone();launchConfetti();},800);
    updateGallery();
    showToast('Foto selesai!','fa-solid fa-images');
    isCapturing=false;document.getElementById('btnCap').disabled=false;
}

async function runCd(sec,sub){
    document.getElementById('cdSub').textContent=sub||'';
    if(sec>0){for(let i=sec;i>0;i--){document.getElementById('cdNum').textContent=i;document.getElementById('cdNum').style.animation='none';void document.getElementById('cdNum').offsetWidth;document.getElementById('cdNum').style.animation='cdPop .55s ease-out';document.getElementById('cdOv').classList.add('on');playBeep();await sleep(1000);}}
    document.getElementById('cdOv').classList.remove('on');document.getElementById('cdSub').textContent='';
}
function flashFx(){document.getElementById('flashOv').classList.add('on');setTimeout(()=>document.getElementById('flashOv').classList.remove('on'),180);}
function captureRaw(){
    const c=document.createElement('canvas');const cw=video.videoWidth||640,ch=video.videoHeight||480;c.width=cw;c.height=ch;
    const x=c.getContext('2d');x.filter=filters.find(f=>f.id===currentFilter).css;
    if(isFlipped){x.translate(cw,0);x.scale(-1,1);}x.drawImage(video,0,0,cw,ch);return c;
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

/* ====== PRINT ANIMATION ====== */
function showPrintAnimation(url){
    const el=document.getElementById('printDrop');const img=document.getElementById('printImg');
    img.src=url;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2200);
}

/* ====== ASSEMBLE RESULT ====== */
function assembleResult(imgs){
    if(selTpl==='grid2x2')return asmGrid(imgs);
    if(selTpl==='strip')return asmStrip(imgs);
    if(selTpl==='polaroid')return asmPolaroid(imgs);
    if(selTpl==='korean')return asmKorean(imgs);
    if(selTpl==='purikura')return asmPurikura(imgs);
    return asmGrid(imgs);
}

function getFC(){return frameDefs.find(f=>f.id===selFrame);}

function drawWatermark(x,w,h){
    x.save();
    const isDark=getFC()?.dark;
    x.font=`bold ${Math.round(Math.min(w,h)*.02)}px Fredoka,sans-serif`;
    x.textAlign='right';x.textBaseline='bottom';
    x.fillStyle=isDark?'rgba(255,255,255,.35)':'rgba(0,0,0,.15)';
    x.shadowColor=isDark?'rgba(0,0,0,.3)':'transparent';x.shadowBlur=2;
    x.fillText('Ponyo Booth',w-10,h-8);x.restore();
}

function asmGrid(imgs){
    const sw=imgs[0].width,sh=imgs[0].height;
    const pad=Math.round(sw*.012),hdH=Math.round(sh*.09);
    const w=sw*2+pad*3,h=sh*2+pad*3+hdH;
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    const fc=getFC();
    x.fillStyle=fc?.dark?'#1A1815':'#FFF0F5';rRect(x,0,0,w,h,16);x.fill();
    drawFrameOnCanvas(x,w,h,selFrame,frameCustom);
    // Header
    x.save();x.globalAlpha=(frameCustom.opacity||80)/100;x.fillStyle=fc?.dark?'#FFFFFF':'#4A3F3A';
    x.font=`bold ${Math.round(hdH*.5)}px Fredoka,sans-serif`;x.textAlign='center';x.textBaseline='middle';
    x.fillText(frameCustom.text||'Ponyo Booth',w/2,pad+hdH/2);x.restore();
    // Date
    x.save();x.globalAlpha=.4;x.font=`${Math.round(hdH*.3)}px Quicksand,sans-serif`;x.textAlign='right';x.textBaseline='middle';
    x.fillStyle=fc?.dark?'#FFFFFF':'#4A3F3A';x.fillText(new Date().toLocaleDateString('id-ID'),w-pad-10,pad+hdH/2);x.restore();
    // Photos
    const sy=pad+hdH+pad;
    for(let i=0;i<4;i++){const col=i%2,row=Math.floor(i/2);const px=pad+col*(sw+pad),py=sy+row*(sh+pad);
        x.save();rRect(x,px,py,sw,sh,6);x.clip();x.drawImage(imgs[i],px,py,sw,sh);x.restore();}
    drawWatermark(x,w,h);return c.toDataURL('image/png');
}

function asmStrip(imgs){
    const sw=imgs[0].width,sh=imgs[0].height;
    const pad=Math.round(sw*.015),hdH=Math.round(sh*.07),ftH=Math.round(sh*.06);
    const imgW=Math.round(sh*.7*(sw/sh));const cnt=imgs.length;
    const w=imgW*cnt+pad*(cnt+1),h=Math.round(sh*.7)+hdH+ftH+pad*3;
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    x.fillStyle='#FFFFFF';rRect(x,0,0,w,h,14);x.fill();
    drawFrameOnCanvas(x,w,h,selFrame,frameCustom);
    x.save();x.globalAlpha=(frameCustom.opacity||80)/100;
    x.fillStyle=getFC()?.dark?'#FFFFFF':'#4A3F3A';
    x.font=`bold ${Math.round(hdH*.6)}px Fredoka,sans-serif`;x.textAlign='center';x.textBaseline='middle';
    x.fillText(frameCustom.text||'Ponyo Booth',w/2,pad+hdH/2);x.restore();
    const sy=pad+hdH+pad,imgH=h-sy-ftH-pad;
    for(let i=0;i<cnt;i++){const px=pad+i*(imgW+pad);x.save();rRect(x,px,sy,imgW,imgH,5);x.clip();x.drawImage(imgs[i],px,sy,imgW,imgH);x.restore();}
    x.save();x.globalAlpha=.5;x.fillStyle=getFC()?.accent||'#F28B9E';
    x.font=`bold ${Math.round(ftH*.5)}px Fredoka,sans-serif`;x.textAlign='center';x.textBaseline='middle';
    x.fillText(new Date().toLocaleDateString('id-ID'),w/2,h-pad-ftH/2);x.restore();
    drawWatermark(x,w,h);return c.toDataURL('image/png');
}

function asmPolaroid(imgs){
    const sw=imgs[0].width,sh=imgs[0].height;
    const m=Math.round(sw*.06),botM=Math.round(sh*.2);
    const w=sw+m*2,h=sh+m+botM+m;
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    x.shadowColor='rgba(0,0,0,.12)';x.shadowBlur=20;x.shadowOffsetY=8;
    x.fillStyle='#FAFAFA';rRect(x,0,0,w,h,4);x.fill();x.shadowColor='transparent';
    drawFrameOnCanvas(x,w,h,selFrame,frameCustom);
    x.save();rRect(x,m,m,sw,sh,2);x.clip();x.drawImage(imgs[0],m,m,sw,sh);x.restore();
    x.save();x.globalAlpha=.7;x.fillStyle=getFC()?.dark?'#FFFFFF':'#4A3F3A';
    x.font=`bold ${Math.round(botM*.3)}px Fredoka,sans-serif`;x.textAlign='center';x.textBaseline='middle';
    x.fillText(frameCustom.text||'Ponyo Booth',w/2,sh+m+botM*.4);
    x.font=`${Math.round(botM*.22)}px Quicksand,sans-serif`;x.globalAlpha=.4;
    x.fillText(new Date().toLocaleDateString('id-ID'),w/2,sh+m+botM*.75);x.restore();
    drawWatermark(x,w,h);return c.toDataURL('image/png');
}

function asmKorean(imgs){
    const sw=imgs[0].width,sh=imgs[0].height;
    const w=sw,h=sh;const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    const fc=getFC();
    x.fillStyle=fc?.dark?'#1A1815':'#FFF5F5';rRect(x,0,0,w,h,16);x.fill();
    drawFrameOnCanvas(x,w,h,selFrame,frameCustom);
    x.save();rRect(x,0,0,w,h,16);x.clip();x.drawImage(imgs[0],0,0,w,h);x.restore();
    const s2w=Math.round(w*.45),s2h=Math.round(sh*.45);
    x.save();x.shadowColor='rgba(0,0,0,.15)';x.shadowBlur=15;x.shadowOffsetY=5;
    x.fillStyle='#FAFAFA';rRect(x,w-s2w-15,h-s2h-15,s2w+10,s2h+10,12);x.fill();x.shadowColor='transparent';
    rRect(x,w-s2w-10,h-s2h-10,s2w,s2h,8);x.clip();x.drawImage(imgs[1],w-s2w-10,h-s2h-10,s2w,s2h);x.restore();
    x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=3;rRect(x,w-s2w-10,h-s2h-10,s2w,s2h,8);x.stroke();
    x.save();x.globalAlpha=.6;x.fillStyle=fc?.dark?'#FFFFFF':'#4A3F3A';
    x.font=`bold ${Math.round(w*.035)}px Fredoka,sans-serif`;x.textAlign='left';x.textBaseline='top';
    x.fillText(frameCustom.text||'Ponyo Booth',15,15);x.restore();
    drawWatermark(x,w,h);return c.toDataURL('image/png');
}

function asmPurikura(imgs){
    const sw=imgs[0].width,sh=imgs[0].height;
    const pad=Math.round(sw*.02),hdH=Math.round(sh*.08),ftH=Math.round(sh*.08);
    const imgW=Math.round((sw-pad*4)/3),imgH=Math.round(sh*.55);
    const w=sw,h=hdH+pad+imgH+pad+ftH+pad;
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    x.fillStyle='#FFF0F6';rRect(x,0,0,w,h,20);x.fill();
    drawFrameOnCanvas(x,w,h,'purikura',frameCustom);
    x.save();x.globalAlpha=(frameCustom.opacity||80)/100;x.fillStyle='#FF7EB3';
    x.font=`bold ${Math.round(hdH*.55)}px Fredoka,sans-serif`;x.textAlign='center';x.textBaseline='middle';
    x.fillText(frameCustom.text||'Purikura',w/2,pad+hdH/2);x.restore();
    const sy=pad+hdH+pad;
    for(let i=0;i<3;i++){const px=pad+i*(imgW+pad);
        x.save();x.shadowColor='rgba(255,126,179,.2)';x.shadowBlur=10;
        x.fillStyle='#FFFFFF';rRect(x,px-3,sy-3,imgW+6,imgH+6,10);x.fill();x.shadowColor='transparent';
        rRect(x,px,sy,imgW,imgH,8);x.clip();x.drawImage(imgs[i],px,sy,imgW,imgH);x.restore();
        x.strokeStyle='#FF7EB3';x.lineWidth=2.5;rRect(x,px,sy,imgW,imgH,8);x.stroke();
    }
    const fy=sy+imgH+pad;
    x.save();x.globalAlpha=.45;x.fillStyle='#FF7EB3';x.font=`bold ${Math.round(ftH*.35)}px Fredoka,sans-serif`;x.textAlign='center';x.textBaseline='middle';
    x.fillText(new Date().toLocaleDateString('id-ID'),w/2,fy+ftH/2);x.restore();
    drawWatermark(x,w,h);return c.toDataURL('image/png');
}

/* ====== GALLERY ====== */
function updateGallery(){
    document.getElementById('galSec').style.display='';const g=document.getElementById('galGrid');g.innerHTML='';
    photos.forEach((p,i)=>{
        const item=document.createElement('div');item.className='gal-item';
        item.innerHTML=`<img src="${p.url}" alt="Foto ${i+1}" loading="lazy"><div class="gal-acts"><button class="g-dl" onclick="dlPhoto(${i})" aria-label="Download"><i class="fa-solid fa-download"></i></button><button class="g-del" onclick="delPhoto(${i})" aria-label="Hapus"><i class="fa-solid fa-trash"></i></button></div>`;
        item.querySelector('img').onclick=()=>openModal(p.url);g.appendChild(item);
    });
}
function dlPhoto(i){const a=document.createElement('a');a.href=photos[i].url;a.download=`ponyo-booth-${Date.now()}.png`;a.click();showToast('Foto didownload!','fa-solid fa-download');}
function delPhoto(i){photos.splice(i,1);updateGallery();if(!photos.length)document.getElementById('galSec').style.display='none';showToast('Foto dihapus','fa-solid fa-trash');}

/* ====== MODAL ====== */
function openModal(src){document.getElementById('modalImg').src=src;document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');}
function dlModal(){const a=document.createElement('a');a.href=document.getElementById('modalImg').src;a.download=`ponyo-booth-${Date.now()}.png`;a.click();}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

/* ====== TOAST ====== */
function showToast(msg,icon){const t=document.createElement('div');t.className='toast';t.innerHTML=`<i class="${icon}" style="color:var(--accent4)"></i> ${msg}`;document.getElementById('toastBox').appendChild(t);setTimeout(()=>t.remove(),3000);}

/* ====== CONFETTI ====== */
const cCvs=document.getElementById('confettiCanvas'),cCtx=cCvs.getContext('2d');
let cPieces=[],cRun=false;
function resizeCC(){cCvs.width=window.innerWidth;cCvs.height=window.innerHeight;}
window.addEventListener('resize',resizeCC);resizeCC();
function launchConfetti(){cPieces=[];const cols=['#F28B9E','#F7B267','#8ECAE6','#A8D8B9','#F5A0B5','#D4C4F0','#FFD4D4'];for(let i=0;i<70;i++)cPieces.push({x:Math.random()*cCvs.width,y:Math.random()*cCvs.height-cCvs.height,w:Math.random()*8+4,h:Math.random()*5+2,c:cols[i%cols.length],vx:(Math.random()-.5)*3,vy:Math.random()*2.5+1.5,r:Math.random()*360,rs:(Math.random()-.5)*8,o:1});if(!cRun){cRun=true;animC();}}
function animC(){cCtx.clearRect(0,0,cCvs.width,cCvs.height);let alive=false;cPieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.rs;p.vy+=.04;if(p.y>cCvs.height-40)p.o-=.02;if(p.o>0){alive=true;cCtx.save();cCtx.globalAlpha=Math.max(0,p.o);cCtx.translate(p.x,p.y);cCtx.rotate(p.r*Math.PI/180);cCtx.fillStyle=p.c;cCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cCtx.restore();}});if(alive)requestAnimationFrame(animC);else{cRun=false;cCtx.clearRect(0,0,cCvs.width,cCvs.height);}}

/* ====== KEYBOARD ====== */
document.addEventListener('keydown',e=>{
    if(e.code==='Space'&&stream&&!isCapturing){e.preventDefault();handleCap();}
    if(e.code==='Escape')closeModal();
});

/* ====== INIT ====== */
initFlGrid();buildFrameScroll();buildTplGrid();updTimerLbl();
</script>
