<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ponyo Booth - Pastel Photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Caveat:wght@400;500;600;700&family=Comfortaa:wght@300;400;700&family=Dancing+Script:wght@400;500;600;700&family,Fredoka:wght@300;400;500;600;700&family=Great+Vibes&family=Indie+Flower&family=Kalam:wght@300;400;700&family=Lobster&family=Pacifico&family=Permanent+Marker&family=Quicksand:wght@400;500;600;700&family=Righteous&family=Sacramento&family=Satisfy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#FFF5F5;--bg2:#FFE8EC;--fg:#4A3F3A;--fg2:#A09088;--accent:#F28B9E;--accent2:#F7B267;--accent3:#8ECAE6;--accent4:#A8D8B9;--card:#FFFFFF;--border:#F5D5DC;--shadow:rgba(200,130,150,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--fg);min-height:100dvh;overflow-x:hidden;background-image:radial-gradient(circle at 20% 20%,rgba(242,139,158,.06)0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(142,202,230,.06)0%,transparent 50%)}
h1,h2,h3,h4{font-family:'Fredoka',sans-serif}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.toast-box{position:fixed;top:1rem;right:1rem;z-index:200;display:flex;flex-direction:column;gap:.5rem}
.toast{background:var(--card);border-radius:12px;padding:.55rem 1rem;box-shadow:0 6px 24px var(--shadow);border-left:3px solid var(--accent4);font-weight:600;font-size:.78rem;display:flex;align-items:center;gap:.35rem;animation:tI .3s ease-out,tO .3s 2.2s forwards}
@keyframes tI{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes tO{to{transform:translateX(110%);opacity:0}}

.modal-ov{position:fixed;inset:0;background:rgba(60,40,45,.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(8px)}
.modal-ov.on{opacity:1;pointer-events:all}
.modal-box{background:var(--card);border-radius:20px;max-width:92vw;max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(60,40,45,.2);transform:scale(.92);transition:transform .3s}
.modal-ov.on .modal-box{transform:scale(1)}
.modal-box img{max-width:100%;display:block;border-radius:18px 18px 0 0}
.modal-acts{padding:.7rem;display:flex;justify-content:center;gap:.5rem}

.print-drop{position:fixed;inset:0;z-index:140;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .3s}
.print-drop.on{opacity:1}
.print-drop .print-img{border-radius:8px;box-shadow:0 15px 50px rgba(60,40,45,.35),0 5px 20px rgba(60,40,45,.2);animation:pS 2s cubic-bezier(.22,1,.36,1) forwards;max-width:82vw;max-height:74vh;object-fit:contain}
@keyframes pS{0%{transform:translateY(-110vh) rotate(-3deg) scale(.8);opacity:0}8%{opacity:1}55%{transform:translateY(10px) rotate(1deg) scale(1);opacity:1}70%{transform:translateY(-5px) rotate(0) scale(1);opacity:1}85%{transform:translateY(3px) rotate(0);opacity:1}100%{transform:translateY(8px) rotate(0);opacity:0}}

#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:100}

.screen{position:relative;z-index:10;max-width:520px;margin:0 auto;padding:1.2rem .8rem 2rem;transition:opacity .4s,transform .4s}
.screen.hide{opacity:0;transform:translateY(-20px);pointer-events:none;position:absolute;left:50%;transform:translateX(-50%) translateY(-20px)}

.tpl-header{text-align:center;margin-bottom:1.3rem}
.tpl-header h1{font-size:clamp(2rem,7vw,3rem);font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.15}
.tpl-header p{color:var(--fg2);font-size:.85rem;margin-top:.25rem;font-weight:500}

.sec{margin-bottom:1.1rem}
.sec-label{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.8rem;margin-bottom:.45rem;display:flex;align-items:center;gap:.35rem;color:var(--fg)}
.sec-label i{color:var(--accent);font-size:.7rem}
.sec-label span{margin-left:auto;font-size:.6rem;color:var(--fg2);font-weight:500}

.hscroll{display:flex;gap:.45rem;overflow-x:auto;padding-bottom:.4rem;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{height:2px}

.frame-card{min-width:68px;max-width:68px;background:var(--card);border:2px solid var(--border);border-radius:12px;padding:.28rem;cursor:pointer;transition:all .2s;scroll-snap-align:start;flex-shrink:0;text-align:center;position:relative}
.frame-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px var(--shadow)}
.frame-card.sel{border-color:var(--accent);box-shadow:0 0 0 2.5px rgba(242,139,158,.12)}
.frame-card.sel::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:2px;right:3px;font-size:.35rem;background:var(--accent);color:#fff;width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.frame-mini{width:100%;aspect-ratio:3/4;border-radius:7px;overflow:hidden;margin-bottom:.15rem;background:linear-gradient(135deg,#FFE8EC,#F5D5DC)}
.frame-mini canvas{width:100%;height:100%;display:block}
.frame-nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.52rem;color:var(--fg)}

.font-card{min-width:fit-content;background:var(--card);border:2px solid var(--border);border-radius:9px;padding:.32rem .65rem;cursor:pointer;transition:all .2s;scroll-snap-align:start;flex-shrink:0;text-align:center;position:relative}
.font-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px var(--shadow)}
.font-card.sel{border-color:var(--accent);box-shadow:0 0 0 2.5px rgba(242,139,158,.12)}
.font-card.sel::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:2px;right:2px;font-size:.3rem;background:var(--accent);color:#fff;width:11px;height:11px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.font-card span{display:block;white-space:nowrap}

.tpl-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem}
.tpl-card{background:var(--card);border:2px solid var(--border);border-radius:10px;padding:.22rem;cursor:pointer;transition:all .2s;text-align:center;position:relative}
.tpl-card:hover{transform:translateY(-2px);box-shadow:0 5px 16px var(--shadow)}
.tpl-card.sel{border-color:var(--accent);box-shadow:0 0 0 2.5px rgba(242,139,158,.12)}
.tpl-card.sel::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:2px;right:2px;font-size:.3rem;background:var(--accent);color:#fff;width:11px;height:11px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tpl-mini{width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;margin-bottom:.1rem;background:linear-gradient(135deg,#FFE8EC,#F5D5DC)}
.tpl-mini canvas{width:100%;height:100%;display:block}
.tpl-nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.48rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-shots{font-size:.4rem;color:var(--accent);font-weight:700;font-family:'Fredoka',sans-serif}

.custom-panel{background:var(--card);border-radius:14px;padding:.6rem .85rem;box-shadow:0 3px 16px var(--shadow);border:2px solid var(--border)}
.custom-row{display:flex;align-items:center;gap:.5rem;font-size:.78rem;font-weight:600;color:var(--fg2)}
.custom-row label{min-width:34px;font-size:.68rem}
.custom-row input[type=text]{flex:1;border:2px solid var(--border);border-radius:9px;padding:.3rem .6rem;font-family:'Quicksand',sans-serif;font-weight:600;font-size:.75rem;color:var(--fg);outline:none;transition:border-color .2s;background:var(--bg)}
.custom-row input[type=text]:focus{border-color:var(--accent)}

.btn-go{font-family:'Fredoka',sans-serif;font-weight:700;border:none;cursor:pointer;border-radius:50px;padding:.85rem 2rem;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:.45rem;margin:1.2rem auto 0;background:linear-gradient(135deg,var(--accent),#F5A0B5,var(--accent2));color:#fff;box-shadow:0 5px 24px rgba(242,139,158,.32);transition:all .25s;width:100%;max-width:280px}
.btn-go:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(242,139,158,.42)}
.btn-go:active{transform:scale(.97)}

/* ===== READY SCREEN ===== */
.ready-ov{position:fixed;inset:0;z-index:160;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,245,245,.97);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .4s}
.ready-ov.on{opacity:1;pointer-events:all}
.ready-icon{font-size:3.5rem;color:var(--accent);animation:rB 1.2s ease-in-out infinite}
@keyframes rB{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.1) rotate(-5deg)}50%{transform:scale(1) rotate(0)}75%{transform:scale(1.1) rotate(5deg)}}
.ready-title{font-family:'Fredoka',sans-serif;font-size:2rem;font-weight:700;color:var(--fg);margin-top:1rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ready-sub{font-family:'Quicksand',sans-serif;font-size:.85rem;color:var(--fg2);margin-top:.3rem;font-weight:600}
.ready-dots{display:flex;gap:.4rem;margin-top:1.2rem}
.ready-dots span{width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.3;animation:rDot 1.4s ease-in-out infinite}
.ready-dots span:nth-child(2){animation-delay:.2s}
.ready-dots span:nth-child(3){animation-delay:.4s}
@keyframes rDot{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.2)}}

/* ===== SUCCESS SCREEN ===== */
.success-ov{position:fixed;inset:0;z-index:155;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,245,245,.92);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .5s}
.success-ov.on{opacity:1;pointer-events:all}
.success-icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent4),var(--accent3));display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:#fff;animation:sPop .6s cubic-bezier(.18,.89,.32,1.28) forwards;transform:scale(0)}
@keyframes sPop{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
.success-title{font-family:'Fredoka',sans-serif;font-size:1.6rem;font-weight:700;color:var(--fg);margin-top:1rem;opacity:0;animation:sFade .5s .3s forwards}
.success-sub{font-family:'Quicksand',sans-serif;font-size:.8rem;color:var(--fg2);margin-top:.3rem;opacity:0;animation:sFade .5s .5s forwards}
@keyframes sFade{to{opacity:1}}

.cam-screen{position:relative;z-index:10;transition:opacity .4s,transform .4s}
.cam-screen.hide{opacity:0;transform:translateY(20px);pointer-events:none;position:absolute;left:0;right:0}
.cam-top{text-align:center;padding:.7rem .8rem .15rem;display:flex;align-items:center;justify-content:center;gap:.5rem}
.cam-top h2{font-size:1rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.btn-bk{background:var(--card);border:2px solid var(--border);color:var(--fg);border-radius:10px;padding:.25rem .6rem;cursor:pointer;font-size:.68rem;font-family:'Quicksand',sans-serif;font-weight:700;transition:all .2s;display:flex;align-items:center;gap:.2rem}
.btn-bk:hover{border-color:var(--accent);color:var(--accent)}
.info-pill{display:inline-flex;align-items:center;gap:.25rem;background:rgba(242,139,158,.1);border:1px solid rgba(242,139,158,.2);border-radius:16px;padding:.15rem .5rem;font-size:.5rem;font-weight:700;color:var(--accent);font-family:'Fredoka',sans-serif}

.cam-wrap{max-width:640px;margin:.3rem auto;padding:0 .8rem}
.cam-frame{position:relative;background:var(--card);border-radius:18px;box-shadow:0 5px 32px var(--shadow),0 0 0 2px var(--border);overflow:hidden;aspect-ratio:4/3}
.cam-frame video{width:100%;height:100%;object-fit:cover;display:block}

/* ===== CINEMATIC COUNTDOWN ===== */
.cd-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.cd-ov.on{opacity:1}
.cd-ring{position:relative;width:120px;height:120px}
.cd-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.cd-ring circle{fill:none;stroke-width:4;stroke-linecap:round}
.cd-ring .cd-bg{stroke:rgba(242,139,158,.15)}
.cd-ring .cd-fg{stroke:var(--accent);stroke-dasharray:339.292;transition:stroke-dashoffset 1s linear,stroke .3s}
.cd-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:3.5rem;font-weight:700;animation:cdP .4s cubic-bezier(.18,.89,.32,1.28)}
@keyframes cdP{0%{transform:scale(2);opacity:0}100%{transform:scale(1);opacity:1}}
.cd-sub{font-family:'Fredoka',sans-serif;font-size:.8rem;color:var(--fg2);margin-top:.6rem;font-weight:600;opacity:.7}

/* ===== CINEMATIC FLASH ===== */
.flash-ov{position:absolute;inset:0;z-index:25;opacity:0;pointer-events:none}
.flash-ov.on{animation:cinFlash .5s ease-out forwards}
.flash-ov .flash-core{position:absolute;inset:0;background:#fff}
.flash-ov .flash-ring{position:absolute;inset:-20%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.6)0%,transparent 60%);animation:flashRing .5s ease-out forwards}
@keyframes cinFlash{0%{opacity:1}100%{opacity:0}}
@keyframes flashRing{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.5);opacity:0}}

.cam-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;background:linear-gradient(135deg,#FFF5F5,#FFE8EC);z-index:5}
.cam-ph i{font-size:2.5rem;color:var(--accent);animation:bI 2s ease-in-out infinite}
@keyframes bI{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.ctrls{max-width:640px;margin:.5rem auto;padding:0 .8rem;display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap}
.btn{font-family:'Fredoka',sans-serif;font-weight:600;border:none;cursor:pointer;border-radius:12px;padding:.55rem 1rem;font-size:.82rem;display:inline-flex;align-items:center;gap:.35rem;transition:all .2s}
.btn:active{transform:scale(.95)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-cap{background:linear-gradient(135deg,var(--accent),#F5A0B5);color:#fff;font-size:.95rem;padding:.65rem 1.5rem;border-radius:50px;box-shadow:0 4px 20px rgba(242,139,158,.32)}
.btn-cap:hover:not(:disabled){box-shadow:0 6px 28px rgba(242,139,158,.45);transform:translateY(-2px)}
.btn-fl{background:var(--card);color:var(--fg);border:2px solid var(--border)}
.btn-fl:hover{border-color:var(--accent);color:var(--accent)}

.panels{max-width:640px;margin:.2rem auto 1.5rem;padding:0 .8rem;display:flex;flex-direction:column;gap:.5rem}
.pnl{background:var(--card);border-radius:16px;padding:.7rem .9rem;box-shadow:0 3px 16px var(--shadow);border:2px solid var(--border)}
.pnl-t{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.78rem;color:var(--fg2);margin-bottom:.4rem;display:flex;align-items:center;gap:.35rem}
.pnl-t i{color:var(--accent);font-size:.7rem}
.tm-row{display:flex;align-items:center;gap:.6rem;font-size:.75rem;font-weight:600;color:var(--fg2)}
.tm-row input[type=range]{flex:1;accent-color:var(--accent);height:4px}

.fl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.3rem}
.fl-item{text-align:center;cursor:pointer;border-radius:10px;padding:.2rem .1rem;transition:all .2s;border:2px solid transparent}
.fl-item:hover{background:var(--bg2)}
.fl-item.on{border-color:var(--accent);background:rgba(242,139,158,.06)}
.fl-prev{width:100%;aspect-ratio:4/3;border-radius:6px;margin:0 auto .15rem;overflow:hidden;background:linear-gradient(135deg,#FFE0E8,#F5C8D4);position:relative}
.fl-prev::after{content:'';position:absolute;inset:0;border-radius:6px}
.fl-item[data-f="none"] .fl-prev::after{background:transparent}
.fl-item[data-f="grayscale"] .fl-prev::after{background:grayscale(100%);mix-blend-mode:multiply}
.fl-item[data-f="sepia"] .fl-prev::after{background:sepia(80%);mix-blend-mode:multiply}
.fl-item[data-f="warm"] .fl-prev::after{background:linear-gradient(135deg,rgba(255,165,0,.3),rgba(255,69,0,.15))}
.fl-item[data-f="cool"] .fl-prev::after{background:linear-gradient(135deg,rgba(0,191,255,.25),rgba(0,0,139,.15))}
.fl-item[data-f="vintage"] .fl-prev::after{background:linear-gradient(135deg,rgba(210,180,140,.35),rgba(139,90,43,.15))}
.fl-item[data-f="pop"] .fl-prev::after{background:linear-gradient(135deg,rgba(255,0,128,.2),rgba(255,255,0,.2))}
.fl-item[data-f="bw"] .fl-prev::after{background:grayscale(100%) contrast(1.3);mix-blend-mode:multiply}
.fl-item[data-f="invert"] .fl-prev::after{background:invert(100%);mix-blend-mode:multiply}
.fl-item[data-f="fade"] .fl-prev::after{background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3))}
.fl-nm{font-size:.5rem;font-weight:600;color:var(--fg)}

.gal-sec{max-width:640px;margin:0 auto 2rem;padding:0 .8rem}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:.5rem}
.gal-item{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 3px 14px var(--shadow);border:2px solid var(--border);cursor:pointer;transition:all .25s}
.gal-item:hover{transform:translateY(-3px);box-shadow:0 6px 22px var(--shadow)}
.gal-item img{width:100%;display:block}
.gal-acts{position:absolute;bottom:0;left:0;right:0;padding:.3rem;display:flex;gap:.2rem;background:linear-gradient(transparent,rgba(60,40,45,.5));opacity:0;transition:opacity .2s}
.gal-item:hover .gal-acts{opacity:1}
.gal-acts button{flex:1;padding:.25rem;border:none;border-radius:7px;font-size:.62rem;font-weight:600;cursor:pointer;font-family:'Quicksand',sans-serif;display:flex;align-items:center;justify-content:center;gap:.15rem}
.g-dl{background:var(--accent);color:#fff}
.g-del{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(3px)}

.float-d{position:fixed;pointer-events:none;z-index:1;opacity:.06;font-size:1.6rem;animation:fA 20s linear infinite}
@keyframes fA{0%{transform:translateY(100vh) rotate(0)}100%{transform:translateY(-10vh) rotate(360deg)}}
footer{text-align:center;padding:.8rem .6rem 1rem;color:var(--fg2);font-size:.68rem;position:relative;z-index:10;font-weight:500}
footer i{color:var(--accent)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:420px){.tpl-grid{grid-template-columns:repeat(5,1fr);gap:.28rem}.frame-card{min-width:58px;max-width:58px}.cd-ring{width:90px;height:90px}.cd-num{font-size:2.8rem}.fl-grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:421px) and (max-width:640px){.tpl-grid{grid-template-columns:repeat(6,1fr)}}
@media(min-width:641px){.tpl-grid{grid-template-columns:repeat(9,1fr)}}
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>
<div class="toast-box" id="toastBox"></div>

<div class="modal-ov" id="modal" role="dialog" aria-label="Preview foto">
<div class="modal-box">
<img id="modalImg" src="" alt="Preview">
<div class="modal-acts">
<button class="btn btn-cap" onclick="dlModal()" style="font-size:.75rem;padding:.45rem 1rem"><i class="fa-solid fa-download"></i> Download</button>
<button class="btn btn-fl" onclick="closeModal()" style="font-size:.75rem"><i class="fa-solid fa-xmark"></i> Tutup</button>
</div>
</div>
</div>

<div class="print-drop" id="printDrop"><img class="print-img" id="printImg" src="" alt=""></div>

<!-- READY SCREEN -->
<div class="ready-ov" id="readyOv">
<i class="fa-solid fa-camera ready-icon"></i>
<div class="ready-title">Siap?</div>
<div class="ready-sub" id="readySub">4 foto akan diambil</div>
<div class="ready-dots"><span></span><span></span><span></span></div>
</div>

<!-- SUCCESS SCREEN -->
<div class="success-ov" id="successOv">
<div class="success-icon"><i class="fa-solid fa-check"></i></div>
<div class="success-title">Foto Selesai!</div>
<div class="success-sub">Cek galeri untuk download</div>
</div>

<div class="float-d" style="left:5%;animation-delay:0s">&#10024;</div>
<div class="float-d" style="left:30%;animation-delay:5s;font-size:1.2rem">&#127800;</div>
<div class="float-d" style="left:55%;animation-delay:10s">&#9733;</div>
<div class="float-d" style="left:78%;animation-delay:13s;font-size:1.3rem">&#127801;</div>

<script>
/* ====== STATE ====== */
let stream=null,currentFilter='none',photos=[],facingMode='user',isFlipped=true,isCapturing=false,multiImgs=[];
let selFrame='classic',selTpl='grid2x2';
let fc={text:'',font:'Caveat'};
const video=document.getElementById('video'),camPh=document.getElementById('camPh');
const CD_CIRC=339.292;

/* ====== CORNER DESIGNS ====== */
const frameDefs=[
{id:'classic',name:'Classic',bg:'#FAFAFA',border:'#E8E4E0',dark:false,cr:8},
{id:'sharp',name:'Sharp',bg:'#FAFAFA',border:'#D8D4D0',dark:false,cr:0},
{id:'rounded',name:'Rounded',bg:'#FFF8F5',border:'#F0DDD5',dark:false,cr:14},
{id:'puffy',name:'Puffy',bg:'#FFF5F8',border:'#F5D5DD',dark:false,cr:16},
{id:'pastel',name:'Pastel',bg:'#F5F0FF',border:'#DDD0F0',dark:false,cr:10},
{id:'peach',name:'Peach',bg:'#FFF8F0',border:'#F0D8C0',dark:false,cr:8},
{id:'mint',name:'Mint',bg:'#F0FFF5',border:'#C8E8D8',dark:false,cr:10},
{id:'sky',name:'Sky',bg:'#F0F8FF',border:'#C8D8F0',dark:false,cr:8},
{id:'cream',name:'Cream',bg:'#FFFCF0',border:'#E8DCC0',dark:false,cr:8},
{id:'rose',name:'Rose',bg:'#FFF0F3',border:'#F0C8D0',dark:false,cr:12},
{id:'dark',name:'Dark',bg:'#1A1A1A',border:'#444444',dark:true,cr:8},
{id:'night',name:'Night',bg:'#0D0D1A',border:'#333355',dark:true,cr:8},
];

/* ====== TEMPLATE LAYOUTS ====== */
const tplDefs=[
{id:'grid2x2',name:'2x2',shots:4},{id:'strip',name:'Strip',shots:4},{id:'polaroid',name:'Polaroid',shots:1},
{id:'korean',name:'Korean',shots:2},{id:'purikura',name:'Purikura',shots:3},{id:'filmstrip',name:'Film',shots:4},
{id:'diptych',name:'Diptych',shots:2},{id:'poster',name:'Poster',shots:3},{id:'boomerang',name:'Boom',shots:2},
{id:'diamond',name:'Diamond',shots:4},{id:'mosaic',name:'Mosaic',shots:5},{id:'story',name:'Story',shots:3},
{id:'collage',name:'3x2',shots:6},{id:'lshape',name:'L-Shape',shots:3},{id:'brick',name:'Brick',shots:3},
{id:'dblpolaroid',name:'Dbl Polar',shots:2},{id:'golden',name:'Golden',shots:3},{id:'pinboard',name:'Pin',shots:4},
];

/* ====== FONT OPTIONS ====== */
const fontOpts=[
{id:'Caveat',sm:.95},{id:'Dancing Script',sm:.78},{id:'Pacifico',sm:.6},{id:'Fredoka',sm:.65},
{id:'Quicksand',sm:.6},{id:'Sacramento',sm:.7},{id:'Great Vibes',sm:.66},{id:'Kalam',sm:.82},
{id:'Satisfy',sm:.7},{id:'Lobster',sm:.58},{id:'Permanent Marker',sm:.65},{id:'Indie Flower',sm:.85},
{id:'Amatic SC',sm:1.08},{id:'Comfortaa',sm:.55},{id:'Righteous',sm:.6},
];

/* ====== FILTERS ====== */
const filters=[
{id:'none',name:'Normal',css:'none'},{id:'grayscale',name:'B&W',css:'grayscale(100%)'},
{id:'sepia',name:'Sepia',css:'sepia(80%) contrast(1.1)'},{id:'warm',name:'Hangat',css:'saturate(1.4) sepia(20%) brightness(1.05)'},
{id:'cool',name:'Dingin',css:'saturate(.9) hue-rotate(180deg) brightness(1.05)'},{id:'vintage',name:'Vintage',css:'sepia(40%) contrast(1.15) brightness(.95) saturate(.8)'},
{id:'pop',name:'Pop Art',css:'saturate(2.5) contrast(1.3) brightness(1.1)'},{id:'bw',name:'Noir',css:'grayscale(100%) contrast(1.5) brightness(.9)'},
{id:'invert',name:'Negatif',css:'invert(100%)'},{id:'fade',name:'Fade',css:'brightness(1.1) saturate(.7) contrast(.9)'},
];

/* ====== AUDIO ====== */
let aCtx=null;
function gAC(){if(!aCtx)aCtx=new(window.AudioContext||window.webkitAudioContext)();return aCtx;}
function playBeep(freq){try{const a=gAC(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=freq||880;o.type='sine';g.gain.setValueAtTime(.1,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.15);o.start(a.currentTime);o.stop(a.currentTime+.15);}catch(e){}}
function playShutter(){try{const a=gAC(),l=a.sampleRate*.12,b=a.createBuffer(1,l,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,3);const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.setValueAtTime(.25,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=1;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime);}catch(e){}}
function playPrint(){try{const a=gAC(),dur=.8,l=a.sampleRate*dur,b=a.createBuffer(1,l,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<l;i++){const t=i/a.sampleRate;d[i]=(Math.random()*2-1)*.09*Math.exp(-t*6)*Math.abs(Math.sin(t*35));}const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.value=.15;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=700;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime);}catch(e){}}
function playDone(){try{const a=gAC();[523,659,784,1047].forEach((fr,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=fr;o.type='sine';const t=a.currentTime+i*.12;g.gain.setValueAtTime(.07,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.2);});}catch(e){}}
function playReady(){try{const a=gAC();[440,554].forEach((fr,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=fr;o.type='triangle';const t=a.currentTime+i*.15;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}catch(e){}}

/* ====== UTILS ====== */
function rR(c,x,y,w,h,r){w=Math.max(0,w);h=Math.max(0,h);r=Math.min(Math.max(0,r),w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}

function drawCover(ctx,img,dx,dy,dw,dh,rad){
    if(!img||dw<=0||dh<=0)return;rad=Math.max(0,Math.min(rad,dw/2,dh/2));
    ctx.save();rR(ctx,dx,dy,dw,dh,rad);ctx.clip();
    const iw=img.width||1,ih=img.height||1,iR=iw/ih,dR=dw/dh;
    let sx,sy,sw,sh;
    if(iR>dR){sh=ih;sw=ih*dR;sx=(iw-sw)/2;sy=0;}else{sw=iw;sh=iw/dR;sx=0;sy=(ih-sh)/2;}
    ctx.drawImage(img,sx,sy,sw,sh,dx,dy,dw,dh);ctx.restore();
}

function slp(ms){return new Promise(r=>setTimeout(r,ms));}
function gFD(){return frameDefs.find(f=>f.id===selFrame);}
function gFont(){return fontOpts.find(f=>f.id===fc.font)||fontOpts[0];}

/* Draw corner card style */
function drawCS(ctx,w,h,fid){
    const d=frameDefs.find(f=>f.id===fid);if(!d)return;
    ctx.save();ctx.fillStyle=d.bg;rR(ctx,0,0,w,h,d.cr);ctx.fill();ctx.strokeStyle=d.border;
    if(fid==='classic'){ctx.lineWidth=1.5;rR(ctx,1.5,1.5,w-3,h-3,d.cr);ctx.stroke();}
    else if(fid==='sharp'){ctx.lineWidth=2;ctx.strokeRect(2,2,w-4,h-4);}
    else if(fid==='rounded'||fid==='peach'||fid==='mint'){ctx.lineWidth=1;rR(ctx,2,2,w-4,h-4,d.cr);ctx.stroke();}
    else if(fid==='puffy'){ctx.lineWidth=1.5;rR(ctx,2,2,w-4,h-4,d.cr);ctx.stroke();ctx.globalAlpha=.3;rR(ctx,5,5,w-10,h-10,Math.max(0,d.cr-3));ctx.stroke();}
    else if(fid==='pastel'){ctx.lineWidth=1;rR(ctx,2,2,w-4,h-4,d.cr);ctx.stroke();ctx.globalAlpha=.15;rR(ctx,5,5,w-10,h-10,Math.max(0,d.cr-2));ctx.stroke();}
    else if(fid==='sky'||fid==='rose'){ctx.lineWidth=1.5;rR(ctx,2,2,w-4,h-4,d.cr);ctx.stroke();}
    else if(fid==='cream'){ctx.lineWidth=2;rR(ctx,1.5,1.5,w-3,h-3,d.cr);ctx.stroke();ctx.globalAlpha=.2;ctx.lineWidth=1;rR(ctx,4,4,w-8,h-8,Math.max(0,d.cr-2));ctx.stroke();}
    else if(fid==='dark'){ctx.strokeStyle='#444';ctx.lineWidth=1.5;rR(ctx,1.5,1.5,w-3,h-3,d.cr);ctx.stroke();}
    else if(fid==='night'){ctx.strokeStyle='#333355';ctx.lineWidth=1;rR(ctx,1.5,1.5,w-3,h-3,d.cr);ctx.stroke();ctx.globalAlpha=.15;ctx.strokeStyle='#4444AA';rR(ctx,5,5,w-10,h-10,Math.max(0,d.cr-2));ctx.stroke();}
    ctx.restore();
}

function dSh(ctx,x,y,w,h,r){ctx.save();ctx.shadowColor='rgba(0,0,0,.06)';ctx.shadowBlur=6;ctx.shadowOffsetY=2;ctx.fillStyle='rgba(0,0,0,0)';rR(ctx,x,y,w,h,r);ctx.fill();ctx.restore();}
function dP(ctx,img,x,y,w,h,r){dSh(ctx,x,y,w,h,r);drawCover(ctx,img,x,y,w,h,r);}

function dTx(ctx,x,y,mw,dk,fs){
    const f=gFont();const sz=Math.round((fs||26)*f.sm);
    ctx.save();ctx.font=`${sz}px '${f.id}',cursive`;ctx.fillStyle=dk?'rgba(255,255,255,.7)':'rgba(80,60,50,.7)';
    ctx.textAlign='center';ctx.textBaseline='middle';const txt=fc.text||'Ponyo Booth';
    const words=txt.split(' ');let line='',lines=[];
    for(const w of words){const t=line+w+' ';if(ctx.measureText(t).width>mw&&line){lines.push(line.trim());line=w+' ';}else line=t;}
    lines.push(line.trim());const lh=sz*1.3;const sy=y-(lines.length-1)*lh/2;
    lines.forEach((l,i)=>ctx.fillText(l,x,sy+i*lh));ctx.restore();
}
function dWM(x,w,h){x.save();const dk=gFD()?.dark;x.font=`bold ${Math.round(Math.min(w,h)*.016)}px Fredoka,sans-serif`;x.textAlign='right';x.textBaseline='bottom';x.fillStyle=dk?'rgba(255,255,255,.25)':'rgba(0,0,0,.1)';x.fillText('Ponyo Booth',w-10,h-6);x.restore();}
function dDt(ctx,x,y,dk,fs){ctx.save();ctx.font=`${fs||14}px Quicksand,sans-serif`;ctx.fillStyle=dk?'rgba(255,255,255,.22)':'rgba(80,60,50,.22)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(new Date().toLocaleDateString('id-ID'),x,y);ctx.restore();}

/* ====== DECORATION HELPERS ====== */
function dSparkle(ctx,x,y,sz,col){
    ctx.save();ctx.fillStyle=col||'rgba(242,139,158,.5)';ctx.translate(x,y);
    ctx.beginPath();for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.moveTo(0,0);ctx.lineTo(-sz*.25,-sz);ctx.lineTo(0,-sz*.4);ctx.lineTo(sz*.25,-sz);}
    ctx.fill();ctx.restore();
}
function dStar(ctx,x,y,r,col){ctx.save();ctx.fillStyle=col||'rgba(247,178,103,.4)';ctx.translate(x,y);ctx.beginPath();for(let i=0;i<5;i++){ctx.rotate(Math.PI*2/5);ctx.lineTo(0,-r);ctx.rotate(Math.PI/5);ctx.lineTo(0,-r*.4);}ctx.closePath();ctx.fill();ctx.restore();}
function dHeart(ctx,x,y,sz,col){ctx.save();ctx.fillStyle=col||'rgba(242,139,158,.35)';ctx.translate(x,y);ctx.scale(sz/15,sz/15);ctx.beginPath();ctx.moveTo(0,-6);ctx.bezierCurveTo(-12,-18,-24,-4,0,12);ctx.bezierCurveTo(24,-4,12,-18,0,-6);ctx.fill();ctx.restore();}
function dDot(ctx,x,y,r,col){ctx.save();ctx.fillStyle=col||'rgba(142,202,230,.3)';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();}
function dGrain(ctx,w,h,intensity){
    ctx.save();const id=ctx.createImageData(w,h),d=id.data;
    for(let i=0;i<d.length;i+=4){const v=Math.random()*255;d[i]=v;d[i+1]=v;d[i+2]=v;d[i+3]=intensity||12;}
    ctx.putImageData(id,0,0);ctx.restore();
}
function dLightLeak(ctx,w,h,col,angle){
    ctx.save();ctx.translate(w/2,h/2);ctx.rotate((angle||0)*Math.PI/180);
    const g=ctx.createRadialGradient(w*.3,0,0,w*.3,0,w*.7);
    g.addColorStop(0,col||'rgba(255,180,150,.12)');g.addColorStop(1,'rgba(255,180,150,0)');
    ctx.fillStyle=g;ctx.fillRect(-w,-h,w*2,h*2);ctx.restore();
}
function dVignette(ctx,w,h,str){ctx.save();const g=ctx.createRadialGradient(w/2,h/2,w*.25,w/2,h/2,w*.75);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${str||.12})`);ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.restore();}
function dBloom(ctx,w,h){ctx.save();const g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w*.5);g.addColorStop(0,'rgba(255,240,250,.08)');g.addColorStop(1,'rgba(255,240,250,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.restore();}
function dWashi(ctx,x,y,w,h,col,rot){
    ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate((rot||0)*Math.PI/180);
    ctx.fillStyle=col||'rgba(242,139,158,.2)';ctx.fillRect(-w/2,-h/2,w,h);
    ctx.strokeStyle=col?col.replace(/[\d.]+\)$/,'.4)'):'rgba(242,139,158,.3)';ctx.lineWidth=.5;
    for(let i=-w/2;i<w/2;i+=6){ctx.beginPath();ctx.moveTo(i,-h/2);ctx.lineTo(i+3,h/2);ctx.stroke();}
    ctx.restore();
}
function dRibbon(ctx,x1,y1,x2,y2,col,w2){
    ctx.save();ctx.strokeStyle=col||'rgba(242,139,158,.25)';ctx.lineWidth=w2||3;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo((x1+x2)/2,y1-20,x2,y2);ctx.stroke();ctx.restore();
}
function dSprocket(ctx,x,y,w,h){
    ctx.save();ctx.fillStyle='#444';const sp=Math.round(h/5);
    for(let i=0;i<5;i++){const sy=y+i*sp+sp/2;rR(ctx,x,sy-2,w*.6,4,1);ctx.fill();}
    ctx.restore();
}

/* ====== BUILD SELECTIONS ====== */
function buildFrameScroll(){
    const sc=document.getElementById('frameScroll');sc.innerHTML='';
    document.getElementById('fcCnt').textContent=frameDefs.length+' corner';
    frameDefs.forEach(f=>{
        const c=document.createElement('div');c.className='frame-card'+(f.id===selFrame?' sel':'');c.dataset.fid=f.id;
        c.onclick=()=>{selFrame=f.id;document.querySelectorAll('.frame-card').forEach(x=>x.classList.toggle('sel',x.dataset.fid===f.id));drawTplPreviews();};
        c.innerHTML=`<div class="frame-mini"><canvas id="fm_${f.id}"></canvas></div><div class="frame-nm">${f.name}</div>`;sc.appendChild(c);
    });
    setTimeout(()=>{frameDefs.forEach(f=>{
        const cv=document.getElementById('fm_'+f.id);if(!cv)return;cv.width=90;cv.height=120;
        const x=cv.getContext('2d');drawCS(x,90,120,f.id);const m=5,fc2=Math.min(f.cr,7);
        x.save();rR(x,m,m,80,85,fc2);x.clip();x.fillStyle=f.dark?'#2A2520':'#F0EAE2';x.fillRect(m,m,80,85);
        x.fillStyle=f.dark?'rgba(255,255,255,.3)':'rgba(0,0,0,.08)';x.font='16px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('\u{1F4F7}',45,m+42);x.restore();
        x.save();x.globalAlpha=.25;x.fillStyle=f.dark?'#FFF':'#4A3F3A';x.font='6px Caveat,cursive';x.textAlign='center';x.textBaseline='middle';x.fillText('xoxo ~',45,100);x.restore();
    });},50);
}

function buildTplGrid(){
    const g=document.getElementById('tplGrid');g.innerHTML='';
    document.getElementById('tcCnt').textContent=tplDefs.length+' layout';
    tplDefs.forEach(t=>{
        const c=document.createElement('div');c.className='tpl-card'+(t.id===selTpl?' sel':'');c.dataset.tid=t.id;
        c.onclick=()=>{selTpl=t.id;document.querySelectorAll('.tpl-card').forEach(x=>x.classList.toggle('sel',x.dataset.tid===t.id));};
        c.innerHTML=`<div class="tpl-mini"><canvas id="tm_${t.id}"></canvas></div><div class="tpl-nm">${t.name}</div><div class="tpl-shots">${t.shots}x</div>`;g.appendChild(c);
    });
    setTimeout(drawTplPreviews,50);
}

function dMP(x,bg,ic,rx,ry,rw,rh,r){x.save();rR(x,rx,ry,rw,rh,r||2);x.clip();x.fillStyle=bg;x.fillRect(rx,ry,rw,rh);x.fillStyle=ic;x.font='9px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('\u{1F4F7}',rx+rw/2,ry+rh/2);x.restore();}

function drawTplPreviews(){
    tplDefs.forEach(t=>{
        const cv=document.getElementById('tm_'+t.id);if(!cv)return;cv.width=80;cv.height=80;
        const x=cv.getContext('2d');const dk=gFD()?.dark;const bg=dk?'#2A2520':'#F0EAE2';const ic=dk?'rgba(255,255,255,.25)':'rgba(0,0,0,.08)';
        drawCS(x,80,80,selFrame);const m=3,g=2;
        if(t.id==='grid2x2'){const s=Math.floor((74-g)/2);for(let r=0;r<2;r++)for(let c=0;c<2;c++)dMP(x,bg,ic,m+c*(s+g),m+r*(s+g),s,s,1);}

/* ====== SESSION ====== */
function startSession(){
    const td=tplDefs.find(t=>t.id===selTpl),fd=gFD();

function backToTpl(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}multiImgs=[];document.getElementById('scrCam').classList.add('hide');setTimeout(()=>{document.getElementById('scrTpl').classList.remove('hide');},300);}

/* ====== CAMERA ====== */
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode,width:{ideal:1280},height:{ideal:960}},audio:false});video.srcObject=stream;await video.play();camPh.style.display='none';showToast('Kamera aktif!','fa-solid fa-check');}catch(e){showToast('Gagal akses kamera','fa-solid fa-triangle-exclamation');}}
function flipCam(){facingMode=facingMode==='user'?'environment':'user';isFlipped=facingMode==='user';video.style.transform=`scaleX(${isFlipped?'-1':'1'})`;if(stream)stream.getTracks().forEach(t=>t.stop());startCamera();}

/* ====== FILTER ====== */
function initFlGrid(){const g=document.getElementById('flGrid');filters.forEach(f=>{const it=document.createElement('div');it.className='fl-item'+(f.id==='none'?' on':'');it.dataset.f=f.id;it.onclick=()=>{currentFilter=f.id;video.style.filter=filters.find(x=>x.id===f.id).css;document.querySelectorAll('.fl-item').forEach(el=>el.classList.toggle('on',el.dataset.f===f.id));};it.innerHTML=`<div class="fl-prev"></div><div class="fl-nm">${f.name}</div>`;g.appendChild(it);});}

/* ====== CINEMATIC CAPTURE ====== */
async function handleCap(){if(!stream||isCapturing)return;
    const td=tplDefs.find(t=>t.id===selTpl);
    /* READY SCREEN */
    document.getElementById('readySub').textContent=`${td.shots} foto akan diambil`;
    document.getElementById('readyOv').classList.add('on');playReady();
    await slp(1800);document.getElementById('readyOv').classList.remove('on');
    await slp(300);
    await multiShotCap();
}

async function multiShotCap(){
    isCapturing=true;document.getElementById('btnCap').disabled=true;multiImgs=[];
    const tv=parseInt(document.getElementById('timerSlider').value),td=tplDefs.find(t=>t.id===selTpl),total=td.shots;
    for(let i=0;i<total;i++){
        document.getElementById('capTxt').textContent=`${i+1}/${total}`;
        await runCd(tv,`Foto ${i+1} dari ${total}`);playShutter();cinFlash();multiImgs.push(capRaw());
        if(i<total-1)await slp(400);
    }
    document.getElementById('capTxt').textContent='Ambil Foto';
    const url=asmResult(multiImgs);photos.push({url});
    /* SUCCESS SCREEN */
    setTimeout(()=>{playPrint();showPrintAnim(url);},200);
    setTimeout(()=>{document.getElementById('successOv').classList.add('on');playDone();},1800);
    setTimeout(()=>{document.getElementById('successOv').classList.remove('on');launchConfetti();},3500);
    updateGal();showToast('Foto selesai!','fa-solid fa-images');
    isCapturing=false;document.getElementById('btnCap').disabled=false;
}

async function runCd(sec,sub){
    const fg=document.getElementById('cdFg'),numEl=document.getElementById('cdNum');
    document.getElementById('cdSub').textContent=sub||'';
    const colors=['#F28B9E','#F7B267','#8ECAE6','#A8D8B9','#D4C4F0'];
    if(sec>0){
        for(let i=sec;i>0;i--){
            const col=colors[(sec-i)%colors.length];
            numEl.textContent=i;numEl.style.color=col;
            numEl.style.animation='none';void numEl.offsetWidth;numEl.style.animation='cdP .4s cubic-bezier(.18,.89,.32,1.28)';
            fg.style.stroke=col;fg.style.strokeDashoffset=CD_CIRC;
            document.getElementById('cdOv').classList.add('on');
            playBeep(660+(sec-i)*110);
            await slp(50);fg.style.strokeDashoffset='0';
            await slp(950);
        }
    }
    document.getElementById('cdOv').classList.remove('on');document.getElementById('cdSub').textContent='';
}

function cinFlash(){const el=document.getElementById('flashOv');el.classList.remove('on');void el.offsetWidth;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),600);}
function capRaw(){const c=document.createElement('canvas'),cw=video.videoWidth||640,ch=video.videoHeight||480;c.width=cw;c.height=ch;const x=c.getContext('2d');x.filter=filters.find(f=>f.id===currentFilter).css;if(isFlipped){x.translate(cw,0);x.scale(-1,1);}x.drawImage(video,0,0,cw,ch);return c;}
function showPrintAnim(url){const el=document.getElementById('printDrop'),img=document.getElementById('printImg');img.src=url;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2500);}

/* ====== ASSEMBLE WITH DECORATIONS ====== */
function asmResult(imgs){
    const fn={grid2x2:asmGrid,strip:asmStrip,polaroid:asmPolaroid,korean:asmKorean,purikura:asmPurikura,filmstrip:asmFilm,diptych:asmDiptych,poster:asmPoster,boomerang:asmBoomerang,diamond:asmDiamond,mosaic:asmMosaic,story:asmStory,collage:asmCollage,lshape:asmLShape,brick:asmBrick,dblpolaroid:asmDblPolar,golden:asmGolden,pinboard:asmPin};
    return (fn[selTpl]||asmGrid)(imgs);
}
function mkC(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');drawCS(x,w,h,selFrame);return {c,x};}

/* --- GRID 2x2: sparkle + dot scatter --- */
function asmGrid(imgs){
    const sw=imgs[0].width,sh=imgs[0].height,pad=Math.round(sw*.02),mS=Math.round(sw*.025),mT=Math.round(sh*.03),mB=Math.round(sh*.1);
    const cr=Math.min(gFD()?.cr||8,4),w=sw*2+pad*3+mS*2,h=sh*2+pad*3+mT+mB;
    const {c,x}=mkC(w,h);const dk=gFD()?.dark;
    dTx(x,w/2,mT+mB*.35,w-40,dk,Math.round(mB*.4));
    const sy=mT+mB*.6;
    for(let i=0;i<4;i++){const col=i%2,row=Math.floor(i/2);dP(x,imgs[i],mS+pad+col*(sw+pad),sy+pad+row*(sh+pad),sw,sh,cr);}
    dSparkle(x,mS+pad*.5,sy+pad*.5,Math.round(sw*.06),dk?'rgba(255,255,255,.2)':'rgba(242,139,158,.3)');
    dSparkle(x,w-mS-pad*.5,sy+sh+pad*1.5,Math.round(sw*.04),dk?'rgba(255,255,255,.15)':'rgba(247,178,103,.3)');
    dDot(x,w*.3,sy+sh*.5,Math.round(sw*.015),dk?'rgba(142,202,230,.15)':'rgba(142,202,230,.2)');
    dDot(x,w*.7,sy+sh*1.5,Math.round(sw*.012),dk?'rgba(168,216,185,.15)':'rgba(168,216,185,.2)');
    dDot(x,w*.5,sy-2,Math.round(sw*.01),dk?'rgba(247,178,103,.15)':'rgba(247,178,103,.2)');
    dDt(x,w-45,h-mB*.3,dk,Math.round(mB*.18));dWM(x,w,h);return c.toDataURL('image/png');
}

/* --- STRIP: ribbon + washi --- */
function asmStrip(imgs){
    const sh=imgs[0].height,imgW=Math.round(sh*.52),pad=Math.round(imgW*.03),mS=Math.round(imgW*.03),mT=Math.round(sh*.02),mB=Math.round(sh*.08);
    const cr=Math.min(gFD()?.cr||8,3),cnt=imgs.length,w=imgW*cnt+pad*(cnt-1)+mS*2,h=sh+mT+mB;
    const {c,x}=mkC(w,h);const dk=gFD()?.dark;const sy=mT+mB*.55;
    dTx(x,w/2,mT+mB*.25,w-30,dk,Math.round(mB*.4));
    for(let i=0;i<cnt;i++)dP(x,imgs[i],mS+i*(imgW+pad),sy,imgW,sh,cr);
    x.save();x.globalAlpha=.06;x.strokeStyle=dk?'#FFF':'#4A3F3A';x.lineWidth=1;
    for(let i=1;i<cnt;i++){const lx=mS+i*(imgW+pad)-pad/2;x.beginPath();x.moveTo(lx,sy);x.lineTo(lx,sy+sh);x.stroke();}x.restore();
    dWashi(x,mS-5,sy-8,Math.round(w*.15),Math.round(sh*.04),dk?'rgba(255,255,255,.12)':'rgba(242,139,158,.15)',-5);
    dWashi(x,w-mS-Math.round(w*.12),sy+sh-5,Math.round(w*.12),Math.round(sh*.035),dk?'rgba(142,202,230,.12)':'rgba(142,202,230,.15)',8);
    dDt(x,w/2,h-mB*.3,dk,Math.round(mB*.2));dWM(x,w,h);return c.toDataURL('image/png');
}

/* --- POLAROID: washi tape + light leak + vintage vignette --- */
function asmPolaroid(imgs){
    const sw=imgs[0].width,sh=imgs[0].height,mS=Math.round(sw*.035),mT=Math.round(sh*.03),mB=Math.round(sh*.24);
    const cr=Math.min(gFD()?.cr||8,4),w=sw+mS*2,h=sh+mT+mB;

    dWashi(x,mS+sw*.15,mT-6,sw*.3,Math.round(sh*.025),dk?'rgba(255,255,255,.15)':'rgba(242,139,158,.2)',-3);
    dWashi(x,mS+sw*.55,mT-5,sw*.25,Math.round(sh*.02),dk?'rgba(142,202,230,.15)':'rgba(142,202,230,.18)',5);

/* --- KOREAN: soft bloom + heart + star --- */
function asmKorean(imgs){
    const sw=imgs[0].width,sh=imgs[0].height,mS=Math.round(sw*.02),mT=Math.round(sh*.02),mB=Math.round(sh*.12);
    const cr=gFD()?.cr||8,w=sw+mS*2,h=sh+mT+mB;
    const {c,x}=mkC(w,h);const dk=gFD()?.dark;const def=gFD();
    dP(x,imgs[0],mS,mT,sw,sh,Math.min(cr,4));
    const s2w=Math.round(sw*.38),s2h=Math.round(sh*.38),s2x=w-mS-s2w-Math.round(sw*.012),s2y=mT+sh-s2h-Math.round(sh*.012);
    x.save();x.shadowColor='rgba(0,0,0,.14)';x.shadowBlur=14;x.shadowOffsetY=4;x.fillStyle=def?.bg||'#FAFAFA';rR(x,s2x-4,s2y-4,s2w+8,s2h+8,cr+3);x.fill();x.restore();
    x.save();x.strokeStyle=def?.border||'#E8E4E0';x.lineWidth=1;rR(x,s2x-4,s2y-4,s2w+8,s2h+8,cr+3);x.stroke();x.restore();
    drawCover(x,imgs[1],s2x,s2y,s2w,s2h,Math.min(cr,3));
    dBloom(x,w,h);

}

/* --- PURIKURA: sparkle shower + ribbon + bloom --- */
function asmPurikura(imgs){
    const sw=imgs[0].width,sh=imgs[0].height,pad=Math.round(sw*.02),mS=Math.round(sw*.02),mT=Math.round(sh*.05),mB=Math.round(sh*.1);

    const sc=dk?'rgba(255,255,255,':'rgba(';

/* --- FILMSTRIP: grain + sprockets --- */
function asmFilm(imgs){
    const sh=imgs[0].height,spH=Math.round(sh*.045),photoH=sh-spH*2,photoW=Math.round(photoH*.54);
    const pG=Math.round(photoW*.035),filmS=Math.round(photoW*.065),filmW=filmS*2+4*photoW+3*pG;
    const cPad=Math.round(photoW*.02),tH=Math.round(sh*.08);
    const w=filmW+cPad*2,h=sh+cPad+tH+cPad;
    const {c,x}=mkC(w,h);const fx=cPad,fy=cPad;
    x.save();x.fillStyle='#1a1a1a';rR(x,fx,fy,filmW,sh,3);x.fill();x.restore();
    const hW=Math.round(spH*.4),hSp=Math.round(hW*2.2),tHoles=Math.floor((filmW-filmS*2)/hSp);
    const hSt=fx+filmS+((filmW-filmS*2)-tHoles*hSp+hSp)/2;
    x.fillStyle='#555';for(let i=0;i<tHoles;i++){const hx=hSt+i*hSp;rR(x,hx,fy+2,hW,spH-2,1);x.fill();rR(x,hx,fy+sh-spH,hW,spH-2,1);x.fill();}
    const psx=fx+filmS,psy=fy+spH;
    for(let i=0;i<4;i++){const px=psx+i*(photoW+pG);

/* ====== GALLERY ====== */
function updateGal(){
    document.getElementById('galSec').style.display='';const g=document.getElementById('galGrid');g.innerHTML='';
    photos.forEach((p,i)=>{
        const it=document.createElement('div');it.className='gal-item';
        it.innerHTML=`<img src="${p.url}" alt="Foto ${i+1}" loading="lazy"><div class="gal-acts"><button class="g-dl" onclick="event.stopPropagation();dlPh(${i})" aria-label="Download"><i class="fa-solid fa-download"></i></button><button class="g-del" onclick="event.stopPropagation();delPh(${i})" aria-label="Hapus"><i class="fa-solid fa-trash"></i></button></div>`;
        it.querySelector('img').onclick=()=>openModal(p.url);g.appendChild(it);
    });
}
function dlPh(i){const a=document.createElement('a');a.href=photos[i].url;a.download=`ponyo-booth-${Date.now()}.png`;a.click();showToast('Didownload!','fa-solid fa-download');}
function delPh(i){photos.splice(i,1);updateGal();if(!photos.length)document.getElementById('galSec').style.display='none';showToast('Dihapus','fa-solid fa-trash');}

/* ====== MODAL ====== */
function openModal(src){document.getElementById('modalImg').src=src;document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');}
function dlModal(){const a=document.createElement('a');a.href=document.getElementById('modalImg').src;a.download=`ponyo-booth-${Date.now()}.png`;a.click();}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

function showToast(msg,icon){const t=document.createElement('div');t.className='toast';t.innerHTML=`<i class="${icon}" style="color:var(--accent4)"></i> ${msg}`;document.getElementById('toastBox').appendChild(t);setTimeout(()=>t.remove(),2800);}

/* ====== CONFETTI ====== */
const cCvs=document.getElementById('confettiCanvas'),cCtx=cCvs.getContext('2d');let cPc=[],cRun=false;
function rCC(){cCvs.width=innerWidth;cCvs.height=innerHeight;}
addEventListener('resize',rCC);rCC();
function launchConfetti(){cPc=[];const cs=['#F28B9E','#F7B267','#8ECAE6','#A8D8B9','#F5A0B5','#D4C4F0','#FFD4D4','#FFDAB9'];for(let i=0;i<90;i++)cPc.push({x:Math.random()*cCvs.width,y:Math.random()*cCvs.height-cCvs.height,w:Math.random()*8+3,h:Math.random()*5+2,c:cs[i%cs.length],vx:(Math.random()-.5)*4,vy:Math.random()*3+1.5,r:Math.random()*360,rs:(Math.random()-.5)*10,o:1});if(!cRun){cRun=true;aCf();}}
function aCf(){cCtx.clearRect(0,0,cCvs.width,cCvs.height);let alive=false;cPc.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.rs;p.vy+=.04;if(p.y>cCvs.height-40)p.o-=.015;if(p.o>0){alive=true;cCtx.save();cCtx.globalAlpha=Math.max(0,p.o);cCtx.translate(p.x,p.y);cCtx.rotate(p.r*Math.PI/180);cCtx.fillStyle=p.c;cCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cCtx.restore();}});if(alive)requestAnimationFrame(aCf);else{cRun=false;cCtx.clearRect(0,0,cCvs.width,cCvs.height);}}

/* ====== KEYBOARD ====== */
document.addEventListener('keydown',e=>{if(e.code==='Space'&&stream&&!isCapturing){e.preventDefault();handleCap();}if(e.code==='Escape')closeModal();});

/* ====== INIT ====== */
initFlGrid();buildFrameScroll();buildTplGrid();buildFontScroll();updTimer();
</script>
