<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ponyo Booth - Pastel Photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Caveat:wght@400;500;600;700&family=Comfortaa:wght@300;400;700&family=Dancing+Script:wght@400;500;600;700&family=Fredoka:wght@300;400;500;600;700&family=Great+Vibes&family=Indie+Flower&family=Kalam:wght@300;400;700&family=Lobster&family=Pacifico&family=Permanent+Marker&family=Quicksand:wght@400;500;600;700&family=Righteous&family=Sacramento&family=Satisfy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#FFF5F5;--bg2:#FFE8EC;--fg:#4A3F3A;--fg2:#A09088;--accent:#F28B9E;--accent2:#F7B267;--accent3:#8ECAE6;--accent4:#A8D8B9;--card:#FFFFFF;--border:#F5D5DC;--shadow:rgba(200,130,150,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Quicksand',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(circle at 20% 20%,rgba(242,139,158,.06)0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(142,202,230,.06)0%,transparent 50%),radial-gradient(circle at 50% 50%,rgba(247,178,103,.04)0%,transparent 50%)}
h1,h2,h3,h4{font-family:'Fredoka',sans-serif}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.toast-box{position:fixed;top:1rem;right:1rem;z-index:200;display:flex;flex-direction:column;gap:.5rem}
.toast{background:var(--card);border-radius:14px;padding:.65rem 1.1rem;box-shadow:0 8px 30px var(--shadow);border-left:4px solid var(--accent4);font-weight:600;font-size:.82rem;display:flex;align-items:center;gap:.4rem;animation:tI .35s ease-out,tO .35s 2.4s forwards}
@keyframes tI{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes tO{to{transform:translateX(110%);opacity:0}}

.modal-ov{position:fixed;inset:0;background:rgba(60,40,45,.6);z-index:150;display:flex;align-items:center;justify-content:center;padding:1rem;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(8px)}
.modal-ov.on{opacity:1;pointer-events:all}
.modal-box{background:var(--card);border-radius:22px;max-width:92vw;max-height:92vh;overflow:auto;box-shadow:0 24px 60px rgba(60,40,45,.2);transform:scale(.92);transition:transform .3s}
.modal-ov.on .modal-box{transform:scale(1)}
.modal-box img{max-width:100%;display:block;border-radius:20px 20px 0 0}
.modal-acts{padding:.8rem;display:flex;justify-content:center;gap:.5rem}

.print-drop{position:fixed;inset:0;z-index:140;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .3s}
.print-drop.on{opacity:1}
.print-drop .print-img{border-radius:6px;box-shadow:0 12px 50px rgba(60,40,45,.3);animation:pS 1.8s cubic-bezier(.22,1,.36,1) forwards;max-width:80vw;max-height:75vh;object-fit:contain}
@keyframes pS{0%{transform:translateY(-100vh) rotate(-2deg);opacity:0}15%{opacity:1}70%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(20px);opacity:0}}

#confettiCanvas{position:fixed;inset:0;pointer-events:none;z-index:100}

.screen{position:relative;z-index:10;max-width:600px;margin:0 auto;padding:1.5rem 1rem 3rem;transition:opacity .45s,transform .45s}
.screen.hide{opacity:0;transform:translateY(-25px);pointer-events:none;position:absolute;left:50%;transform:translateX(-50%) translateY(-25px)}

.tpl-header{text-align:center;margin-bottom:1.8rem}
.tpl-header h1{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.2}
.tpl-header p{color:var(--fg2);font-size:.92rem;margin-top:.3rem;font-weight:500}

.sec{margin-bottom:1.3rem}
.sec-label{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.85rem;margin-bottom:.55rem;display:flex;align-items:center;gap:.4rem;color:var(--fg)}
.sec-label i{color:var(--accent);font-size:.75rem}

.hscroll{display:flex;gap:.55rem;overflow-x:auto;padding-bottom:.5rem;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{height:3px}

.frame-card{min-width:82px;max-width:82px;background:var(--card);border:2.5px solid var(--border);border-radius:14px;padding:.35rem;cursor:pointer;transition:all .25s;scroll-snap-align:start;flex-shrink:0;text-align:center;position:relative}
.frame-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px var(--shadow)}
.frame-card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,139,158,.15)}
.frame-card.sel::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:3px;right:4px;font-size:.4rem;background:var(--accent);color:#fff;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.frame-mini{width:100%;aspect-ratio:3/4;border-radius:8px;overflow:hidden;margin-bottom:.2rem;background:linear-gradient(135deg,#FFE8EC,#F5D5DC)}
.frame-mini canvas{width:100%;height:100%;display:block}
.frame-nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.6rem;color:var(--fg)}

.font-card{min-width:fit-content;background:var(--card);border:2.5px solid var(--border);border-radius:11px;padding:.4rem .75rem;cursor:pointer;transition:all .25s;scroll-snap-align:start;flex-shrink:0;text-align:center;position:relative}
.font-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px var(--shadow)}
.font-card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,139,158,.15)}
.font-card.sel::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:2px;right:3px;font-size:.35rem;background:var(--accent);color:#fff;width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.font-card span{display:block;white-space:nowrap}

.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.tpl-card{background:var(--card);border:2.5px solid var(--border);border-radius:14px;padding:.4rem;cursor:pointer;transition:all .25s;text-align:center;position:relative}
.tpl-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px var(--shadow)}
.tpl-card.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,139,158,.15)}
.tpl-card.sel::after{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:3px;right:4px;font-size:.4rem;background:var(--accent);color:#fff;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tpl-mini{width:100%;aspect-ratio:1;border-radius:8px;overflow:hidden;margin-bottom:.2rem;background:linear-gradient(135deg,#FFE8EC,#F5D5DC)}
.tpl-mini canvas{width:100%;height:100%;display:block}
.tpl-nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.65rem}
.tpl-desc{font-size:.55rem;color:var(--fg2);margin-top:.02rem}
.tpl-shots{font-size:.5rem;color:var(--accent);font-weight:700;font-family:'Fredoka',sans-serif}

.custom-panel{background:var(--card);border-radius:16px;padding:.7rem 1rem;box-shadow:0 4px 20px var(--shadow);border:2px solid var(--border);margin-bottom:1rem}
.custom-row{display:flex;align-items:center;gap:.6rem;font-size:.8rem;font-weight:600;color:var(--fg2)}
.custom-row label{min-width:40px;font-size:.72rem}
.custom-row input[type=text]{flex:1;border:2px solid var(--border);border-radius:10px;padding:.35rem .7rem;font-family:'Quicksand',sans-serif;font-weight:600;font-size:.78rem;color:var(--fg);outline:none;transition:border-color .2s;background:var(--bg)}
.custom-row input[type=text]:focus{border-color:var(--accent)}

.btn-go{font-family:'Fredoka',sans-serif;font-weight:700;border:none;cursor:pointer;border-radius:50px;padding:.95rem 2.5rem;font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:.5rem;margin:1.5rem auto 0;background:linear-gradient(135deg,var(--accent),#F5A0B5,var(--accent2));color:#fff;box-shadow:0 6px 28px rgba(242,139,158,.35);transition:all .25s;width:100%;max-width:300px}
.btn-go:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(242,139,158,.45)}
.btn-go:active{transform:scale(.97)}

.cam-screen{position:relative;z-index:10;transition:opacity .45s,transform .45s}
.cam-screen.hide{opacity:0;transform:translateY(25px);pointer-events:none;position:absolute;left:0;right:0}
.cam-top{text-align:center;padding:.8rem 1rem .2rem;display:flex;align-items:center;justify-content:center;gap:.6rem}
.cam-top h2{font-size:1.05rem;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.btn-bk{background:var(--card);border:2px solid var(--border);color:var(--fg);border-radius:12px;padding:.3rem .7rem;cursor:pointer;font-size:.73rem;font-family:'Quicksand',sans-serif;font-weight:700;transition:all .2s;display:flex;align-items:center;gap:.25rem}
.btn-bk:hover{border-color:var(--accent);color:var(--accent)}
.info-pill{display:inline-flex;align-items:center;gap:.3rem;background:rgba(242,139,158,.1);border:1px solid rgba(242,139,158,.2);border-radius:20px;padding:.2rem .6rem;font-size:.55rem;font-weight:700;color:var(--accent);font-family:'Fredoka',sans-serif}

.cam-wrap{max-width:680px;margin:.4rem auto;padding:0 1rem}
.cam-frame{position:relative;background:var(--card);border-radius:22px;box-shadow:0 6px 40px var(--shadow),0 0 0 2.5px var(--border);overflow:hidden;aspect-ratio:4/3}
.cam-frame video{width:100%;height:100%;object-fit:cover;display:block}

.cd-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,245,245,.4);backdrop-filter:blur(3px);z-index:20;opacity:0;pointer-events:none;transition:opacity .15s}
.cd-ov.on{opacity:1}
.cd-num{font-family:'Fredoka',sans-serif;font-size:6rem;font-weight:700;color:var(--accent);text-shadow:0 3px 20px rgba(242,139,158,.3);animation:cdP .55s ease-out}
.cd-sub{font-family:'Fredoka',sans-serif;font-size:.95rem;color:var(--fg2);margin-top:.2rem;font-weight:600}
@keyframes cdP{0%{transform:scale(2.2);opacity:0}50%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}
.flash-ov{position:absolute;inset:0;background:#fff;z-index:25;opacity:0;pointer-events:none;transition:opacity .12s}
.flash-ov.on{opacity:.85;transition:opacity 0s}
.cam-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;background:linear-gradient(135deg,#FFF5F5,#FFE8EC);z-index:5}
.cam-ph i{font-size:3rem;color:var(--accent);animation:bI 2s ease-in-out infinite}
@keyframes bI{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.ctrls{max-width:680px;margin:.6rem auto;padding:0 1rem;display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap}
.btn{font-family:'Fredoka',sans-serif;font-weight:600;border:none;cursor:pointer;border-radius:14px;padding:.6rem 1.2rem;font-size:.85rem;display:inline-flex;align-items:center;gap:.4rem;transition:all .22s}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-cap{background:linear-gradient(135deg,var(--accent),#F5A0B5);color:#fff;font-size:1rem;padding:.75rem 1.8rem;border-radius:50px;box-shadow:0 4px 22px rgba(242,139,158,.35)}
.btn-cap:hover:not(:disabled){box-shadow:0 6px 30px rgba(242,139,158,.5);transform:translateY(-2px)}
.btn-fl{background:var(--card);color:var(--fg);border:2px solid var(--border)}
.btn-fl:hover{border-color:var(--accent);color:var(--accent)}

.panels{max-width:680px;margin:.3rem auto 2rem;padding:0 1rem;display:flex;flex-direction:column;gap:.6rem}
.pnl{background:var(--card);border-radius:18px;padding:.8rem 1rem;box-shadow:0 4px 20px var(--shadow);border:2px solid var(--border)}
.pnl-t{font-family:'Fredoka',sans-serif;font-weight:600;font-size:.82rem;color:var(--fg2);margin-bottom:.45rem;display:flex;align-items:center;gap:.4rem}
.pnl-t i{color:var(--accent);font-size:.75rem}
.tm-row{display:flex;align-items:center;gap:.7rem;font-size:.78rem;font-weight:600;color:var(--fg2)}
.tm-row input[type=range]{flex:1;accent-color:var(--accent);height:5px}

.fl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:.4rem}
.fl-item{text-align:center;cursor:pointer;border-radius:12px;padding:.25rem .15rem;transition:all .2s;border:2px solid transparent}
.fl-item:hover{background:var(--bg2)}
.fl-item.on{border-color:var(--accent);background:rgba(242,139,158,.06)}
.fl-prev{width:48px;height:36px;border-radius:8px;margin:0 auto .25rem;overflow:hidden;background:linear-gradient(135deg,#FFE0E8,#F5C8D4);position:relative}
.fl-prev::after{content:'';position:absolute;inset:0;border-radius:8px}
.fl-item[data-f="none"] .fl-prev::after{background:transparent}
.fl-item[data-f="grayscale"] .fl-prev::after{background:grayscale(100%);mix-blend-mode:multiply}
.fl-item[data-f="sepia"] .fl-prev::after{background:sepia(80%);mix-blend-mode:multiply}
.fl-item[data-f="warm"] .fl-prev::after{background:linear-gradient(135deg,rgba(255,165,0,.3),rgba(255,69,0,.15))}
.fl-item[data-f="cool"] .fl-prev::after{background:linear-gradient(135deg,rgba(0,191,255,.25),rgba(0,0,139,.15))}
.fl-item[data-f="vintage"] .fl-prev::after{background:linear-gradient(135deg,rgba(210,180,140,.35),rgba(139,90,43,.15))}
.fl-item[data-f="pop"] .fl-prev::after{background:linear-gradient(135deg,rgba(255,0,128,.2),rgba(255,255,0,.2))}
.fl-item[data-f="bw"] .fl-prev::after{background:grayscale(100%) contrast(1.3);mix-blend-mode:multiply}
.fl-item[data-f="invert"] .fl-prev::after{background:invert(100%);mix-blend-mode:multiply}
.fl-item[data-f="fade"] .fl-prev::after{background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.3))}
.fl-nm{font-size:.6rem;font-weight:600;color:var(--fg)}

.gal-sec{max-width:680px;margin:0 auto 3rem;padding:0 1rem}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6rem}
.gal-item{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px var(--shadow);border:2px solid var(--border);cursor:pointer;transition:all .25s}
.gal-item:hover{transform:translateY(-3px);box-shadow:0 8px 28px var(--shadow)}
.gal-item img{width:100%;display:block}
.gal-acts{position:absolute;bottom:0;left:0;right:0;padding:.35rem;display:flex;gap:.25rem;background:linear-gradient(transparent,rgba(60,40,45,.5));opacity:0;transition:opacity .2s}
.gal-item:hover .gal-acts{opacity:1}
.gal-acts button{flex:1;padding:.3rem;border:none;border-radius:8px;font-size:.68rem;font-weight:600;cursor:pointer;font-family:'Quicksand',sans-serif;display:flex;align-items:center;justify-content:center;gap:.2rem}
.g-dl{background:var(--accent);color:#fff}
.g-del{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(3px)}

.float-d{position:fixed;pointer-events:none;z-index:1;opacity:.06;font-size:1.8rem;animation:fA 22s linear infinite}
@keyframes fA{0%{transform:translateY(100vh) rotate(0)}100%{transform:translateY(-10vh) rotate(360deg)}}
footer{text-align:center;padding:1rem .8rem 1.5rem;color:var(--fg2);font-size:.72rem;position:relative;z-index:10;font-weight:500}
footer i{color:var(--accent)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:640px){.fl-grid{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}.gal-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.btn-cap{padding:.65rem 1.4rem;font-size:.9rem}.tpl-grid{grid-template-columns:repeat(2,1fr)}.frame-card{min-width:72px;max-width:72px}.cd-num{font-size:4.5rem}}
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>
<div class="toast-box" id="toastBox"></div>

<div class="modal-ov" id="modal" role="dialog" aria-label="Preview foto">
<div class="modal-box">
<img id="modalImg" src="" alt="Preview">
<div class="modal-acts">
<button class="btn btn-cap" onclick="dlModal()" style="font-size:.8rem;padding:.5rem 1.2rem"><i class="fa-solid fa-download"></i> Download</button>
<button class="btn btn-fl" onclick="closeModal()" style="font-size:.8rem"><i class="fa-solid fa-xmark"></i> Tutup</button>
</div>
</div>
</div>

<div class="print-drop" id="printDrop"><img class="print-img" id="printImg" src="" alt=""></div>

<div class="float-d" style="left:5%;animation-delay:0s">&#10024;</div>
<div class="float-d" style="left:30%;animation-delay:6s;font-size:1.3rem">&#127800;</div>
<div class="float-d" style="left:55%;animation-delay:11s">&#9733;</div>
<div class="float-d" style="left:78%;animation-delay:14s;font-size:1.5rem">&#127801;</div>
<div class="float-d" style="left:94%;animation-delay:8s">&#10047;</div>

<section class="screen" id="scrTpl">
<div class="tpl-header">
<h1>Ponyo Booth</h1>
<p>Pilih corner desain & layout hasil foto</p>
</div>

<div class="sec">
<div class="sec-label"><i class="fa-solid fa-vector-square"></i> Corner Desain</div>
<div class="hscroll" id="frameScroll"></div>
</div>

<div class="sec">
<div class="sec-label"><i class="fa-solid fa-table-cells"></i> Layout Hasil <span style="font-size:.65rem;color:var(--fg2);font-weight:500;margin-left:auto" id="tplCount"></span></div>
<div class="tpl-grid" id="tplGrid"></div>
</div>

<div class="sec">
<div class="sec-label"><i class="fa-solid fa-pen-fancy"></i> Teks Custom</div>
<div class="custom-panel">
<div class="custom-row"><label>Teks</label><input type="text" id="cFrameText" placeholder="Teks di hasil foto..." maxlength="40" oninput="updateFrameCustom()"></div>
</div>
</div>

<div class="sec">
<div class="sec-label"><i class="fa-solid fa-font"></i> Font Teks <span style="font-size:.65rem;color:var(--fg2);font-weight:500;margin-left:auto" id="fontCount"></span></div>
<div class="hscroll" id="fontScroll"></div>
</div>

<button class="btn-go" onclick="startSession()"><i class="fa-solid fa-camera"></i> Mulai Foto</button>
</section>

<section class="cam-screen hide" id="scrCam">
<div class="cam-top">
<button class="btn-bk" onclick="backToTpl()"><i class="fa-solid fa-arrow-left"></i> Ubah</button>
<h2>Ponyo Booth</h2>
<span class="info-pill" id="infoPill"></span>
</div>
<div class="cam-wrap">
<div class="cam-frame" id="camFrame">
<video id="video" autoplay playsinline muted style="transform:scaleX(-1)"></video>
<div class="cam-ph" id="camPh"><i class="fa-solid fa-camera-retro"></i><p style="color:var(--fg2);font-weight:600;font-size:.85rem">Memulai kamera...</p></div>
<div class="cd-ov" id="cdOv"><span class="cd-num" id="cdNum">3</span><span class="cd-sub" id="cdSub"></span></div>
<div class="flash-ov" id="flashOv"></div>
</div>
</div>
<div class="ctrls">
<button class="btn btn-cap" id="btnCap" onclick="handleCap()"><i class="fa-solid fa-camera"></i> <span id="capTxt">Ambil Foto</span></button>
<button class="btn btn-fl" onclick="flipCam()"><i class="fa-solid fa-arrows-rotate"></i> Balik</button>
</div>
<div class="panels">
<div class="pnl"><div class="pnl-t"><i class="fa-solid fa-clock"></i> Timer</div>
<div class="tm-row"><span>Langsung</span><input type="range" id="timerSlider" min="0" max="5" value="3" step="1" oninput="updTimerLbl()"><span id="timerLbl">3 detik</span></div></div>
<div class="pnl"><div class="pnl-t"><i class="fa-solid fa-wand-magic-sparkles"></i> Filter</div><div class="fl-grid" id="flGrid"></div></div>
</div>
<div class="gal-sec" id="galSec" style="display:none"><div class="pnl"><div class="pnl-t"><i class="fa-solid fa-images"></i> Galeri Foto</div><div class="gal-grid" id="galGrid"></div></div></div>
</section>

<footer>Dibuat dengan <i class="fa-solid fa-heart"></i> Ponyo Booth</footer>

<script>
/* ====== STATE ====== */
let stream=null,currentFilter='none',photos=[],facingMode='user',isFlipped=true,isCapturing=false,multiImgs=[];
let selFrame='classic',selTpl='grid2x2';
let frameCustom={text:'',font:'Caveat'};
const video=document.getElementById('video');
const camPh=document.getElementById('camPh');

/* ====== CORNER DESIGNS ====== */
const frameDefs=[
{id:'classic',name:'Classic',bg:'#FAFAFA',border:'#E8E4E0',dark:false,cr:8},
{id:'sharp',name:'Sharp',bg:'#FAFAFA',border:'#D8D4D0',dark:false,cr:0},
{id:'rounded',name:'Rounded',bg:'#FFF8F5',border:'#F0DDD5',dark:false,cr:14},

/* ====== AUDIO ====== */
let audioCtx=null;
function gAC(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playBeep(){try{const a=gAC(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;o.type='sine';g.gain.setValueAtTime(.08,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.start(a.currentTime);o.stop(a.currentTime+.12);}catch(e){}}
function playShutter(){try{const a=gAC(),l=a.sampleRate*.08,b=a.createBuffer(1,l,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<l;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/l,4);const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.setValueAtTime(.18,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.08);const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2200;f.Q.value=.8;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime);}catch(e){}}
function playPrint(){try{const a=gAC(),dur=.6,l=a.sampleRate*dur,b=a.createBuffer(1,l,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<l;i++){const t=i/a.sampleRate;d[i]=(Math.random()*2-1)*.07*Math.exp(-t*8)*Math.abs(Math.sin(t*40));}const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.value=.12;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=800;s.connect(f);f.connect(g);g.connect(a.destination);s.start(a.currentTime);}catch(e){}}
function playDone(){try{const a=gAC();[523,659,784].forEach((fr,i)=>{const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=fr;o.type='sine';const t=a.currentTime+i*.1;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.start(t);o.stop(t+.15);});}catch(e){}}

/* ====== UTILS ====== */
function rR(ctx,x,y,w,h,r){w=Math.max(0,w);h=Math.max(0,h);r=Math.min(Math.max(0,r),w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function slp(ms){return new Promise(r=>setTimeout(r,ms));}
function gFD(){return frameDefs.find(f=>f.id===selFrame);}
function gFont(){return fontOpts.find(f=>f.id===frameCustom.font)||fontOpts[0];}
function drawCardStyle(ctx,w,h,fid){const d=frameDefs.find(f=>f.id===fid);if(!d)return;ctx.save();ctx.fillStyle=d.bg;rR(ctx,0,0,w,h,d.cr);ctx.fill();ctx.strokeStyle=d.border;if(fid==='classic'){ctx.lineWidth=1.5;rR(ctx,1.5,1.5,w-3,h-3,d.cr);ctx.stroke();}else if(fid==='sharp'){ctx.lineWidth=2;ctx.strokeRect(2,2,w-4,h-4);}else if(fid==='rounded'||fid==='peach'||fid==='mint'){ctx.lineWidth=1;rR(ctx,2,2,w-4,h-4,d.cr);ctx.stroke();}else if(fid==='puffy'){ctx.lineWidth=1.5;rR(ctx,2,2,w-4,h-4,d.cr);ctx.stroke();ctx.globalAlpha=.3;rR(ctx,6,6,w-12,h-12,Math.max(0,d.cr-3));ctx.stroke();}else if(fid==='pastel'){ctx.lineWidth=1;rR(ctx,2,2,w-4,h-4,d.cr);ctx.stroke();ctx.globalAlpha=.15;rR(ctx,6,6,w-12,h-12,Math.max(0,d.cr-2));ctx.stroke();}else if(fid==='sky'||fid==='rose'){ctx.lineWidth=1.5;rR(ctx,2,2,w-4,h-4,d.cr);ctx.stroke();}else if(fid==='cream'){ctx.lineWidth=2;rR(ctx,1.5,1.5,w-3,h-3,d.cr);ctx.stroke();ctx.globalAlpha=.2;ctx.lineWidth=1;rR(ctx,5,5,w-10,h-10,Math.max(0,d.cr-2));ctx.stroke();}else if(fid==='dark'){ctx.strokeStyle='#444';ctx.lineWidth=1.5;rR(ctx,1.5,1.5,w-3,h-3,d.cr);ctx.stroke();}else if(fid==='night'){ctx.strokeStyle='#333355';ctx.lineWidth=1;rR(ctx,1.5,1.5,w-3,h-3,d.cr);ctx.stroke();ctx.globalAlpha=.15;ctx.strokeStyle='#4444AA';rR(ctx,5,5,w-10,h-10,Math.max(0,d.cr-2));ctx.stroke();}ctx.restore();}
function dSh(ctx,x,y,w,h,r){ctx.save();ctx.shadowColor='rgba(0,0,0,.07)';ctx.shadowBlur=7;ctx.shadowOffsetY=2;ctx.fillStyle='rgba(0,0,0,0)';rR(ctx,x,y,w,h,r);ctx.fill();ctx.restore();}
function dPhoto(ctx,img,x,y,w,h,r){dSh(ctx,x,y,w,h,r);ctx.save();rR(ctx,x,y,w,h,Math.max(0,r));ctx.clip();ctx.drawImage(img,x,y,w,h);ctx.restore();}
function dTxt(ctx,x,y,mw,dk,fs){const f=gFont();const sz=Math.round((fs||28)*f.sm);ctx.save();ctx.font=`${sz}px '${f.id}',cursive`;ctx.fillStyle=dk?'rgba(255,255,255,.7)':'rgba(80,60,50,.7)';ctx.textAlign='center';ctx.textBaseline='middle';const txt=frameCustom.text||'Ponyo Booth';const words=txt.split(' ');let line='',lines=[];for(const w of words){const t=line+w+' ';if(ctx.measureText(t).width>mw&&line){lines.push(line.trim());line=w+' ';}else line=t;}lines.push(line.trim());const lh=sz*1.3;const sy=y-(lines.length-1)*lh/2;lines.forEach((l,i)=>ctx.fillText(l,x,sy+i*lh));ctx.restore();}
function dWM(x,w,h){x.save();const dk=gFD()?.dark;x.font=`bold ${Math.round(Math.min(w,h)*.017)}px Fredoka,sans-serif`;x.textAlign='right';x.textBaseline='bottom';x.fillStyle=dk?'rgba(255,255,255,.3)':'rgba(0,0,0,.12)';x.fillText('Ponyo Booth',w-12,h-8);x.restore();}
function dDt(ctx,x,y,dk,fs){ctx.save();ctx.font=`${fs||16}px Quicksand,sans-serif`;ctx.fillStyle=dk?'rgba(255,255,255,.25)':'rgba(80,60,50,.25)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(new Date().toLocaleDateString('id-ID'),x,y);ctx.restore();}

function drawMiniPhoto(x,bg,ic,rx,ry,rw,rh,r){
    x.save();rR(x,rx,ry,rw,rh,r||2);x.clip();x.fillStyle=bg;x.fillRect(rx,ry,rw,rh);x.fillStyle=ic;x.font='10px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('\u{1F4F7}',rx+rw/2,ry+rh/2);x.restore();
}

function drawTplPreviews(){
    tplDefs.forEach(t=>{
        const cv=document.getElementById('tm_'+t.id);if(!cv)return;cv.width=130;cv.height=130;
        const x=cv.getContext('2d');const dk=gFD()?.dark;const bg=dk?'#2A2520':'#F0EAE2';const ic=dk?'rgba(255,255,255,.3)':'rgba(0,0,0,.1)';
        drawCardStyle(x,130,130,selFrame);const m=5,g=3;
        if(t.id==='grid2x2'){const s=Math.floor((130-m*2-g)/2);for(let r=0;r<2;r++)for(let c=0;c<2;c++)drawMiniPhoto(x,bg,ic,m+c*(s+g),m+r*(s+g),s,s,2);}
        else if(t.id==='strip'){const s=Math.floor((130-m*2-g*3)/4);for(let i=0;i<4;i++)drawMiniPhoto(x,bg,ic,m+i*(s+g),m,s,120,2);}
        else if(t.id==='polaroid'){drawMiniPhoto(x,bg,ic,10,8,110,75,2);}
        else if(t.id==='korean'){drawMiniPhoto(x,bg,ic,5,5,80,90,2);drawMiniPhoto(x,dk?'#3A3530':'#E8E0D8',ic,75,60,45,35,2);}
        else if(t.id==='purikura'){const s=Math.floor((130-m*2-g*2)/3);for(let i=0;i<3;i++)drawMiniPhoto(x,bg,ic,m+i*(s+g),m,s,85,2);}
        else if(t.id==='filmstrip'){x.fillStyle='#1a1a1a';rR(x,5,5,120,120,3);x.fill();const sp=6,ph=108,pw=Math.floor(ph*.5),pg=3,pfx=8;for(let i=0;i<4;i++)drawMiniPhoto(x,'#3A3530','rgba(255,255,255,.2)',pfx+i*(pw+pg),5+sp,pw,ph,2);x.fillStyle='#555';for(let i=0;i<8;i++){rR(x,8+i*14,7,5,sp-2,1);x.fill();rR(x,8+i*14,130-sp+1,5,sp-2,1);x.fill();}}
        else if(t.id==='diptych'){const s=Math.floor((120-g)/2);for(let i=0;i<2;i++)drawMiniPhoto(x,bg,ic,m+i*(s+g),m,s,120,2);}
        else if(t.id==='poster'){const lw=Math.floor((118-g)*.6),rw=118-g-lw,rh=Math.floor((118-g)/2);drawMiniPhoto(x,bg,ic,m,m,lw,118,2);drawMiniPhoto(x,bg,ic,m+lw+g,m,rw,rh,2);drawMiniPhoto(x,bg,ic,m+lw+g,m+rh+g,rw,118-rh-g,2);}
        else if(t.id==='boomerang'){drawMiniPhoto(x,bg,ic,m,m,120,65,2);drawMiniPhoto(x,bg,ic,m+30,70,60,52,2);}
        else if(t.id==='diamond'){const pw=55,ph=50,ox=37,oy=20;drawMiniPhoto(x,bg,ic,m+ox,m,pw,ph,2);drawMiniPhoto(x,bg,ic,m,m+oy,pw,ph,2);drawMiniPhoto(x,bg,ic,m+70,m+oy,pw,ph,2);drawMiniPhoto(x,bg,ic,m+ox,m+oy*2,pw,ph,2);}
        else if(t.id==='mosaic'){const lw=Math.floor((118-g)*.6),rw=118-g-lw,rg=2,rw2=Math.floor((rw-rg)/2),rh2=Math.floor((118-rg)/2);drawMiniPhoto(x,bg,ic,m,m,lw,118,2);drawMiniPhoto(x,bg,ic,m+lw+g,m,rw2,rh2,2);drawMiniPhoto(x,bg,ic,m+lw+g+rw2+rg,m,rw2,rh2,2);drawMiniPhoto(x,bg,ic,m+lw+g,m+rh2+rg,rw2,rh2,2);drawMiniPhoto(x,bg,ic,m+lw+g+rw2+rg,m+rh2+rg,rw2,rh2,2);}
        else if(t.id==='story'){const h2=Math.floor((118-g*2)/3);for(let i=0;i<3;i++)drawMiniPhoto(x,bg,ic,m,m+i*(h2+g),120,h2,2);}
        else if(t.id==='collage'){const cw=Math.floor((118-g*2)/3),ch=Math.floor((118-g)/2);for(let i=0;i<6;i++){const c=i%3,r=Math.floor(i/3);drawMiniPhoto(x,bg,ic,m+c*(cw+g),m+r*(ch+g),cw,ch,2);}}
        else if(t.id==='lshape'){const lw=Math.floor((118-g)*.6),rw=118-g-lw,rh=Math.floor((118-g)/2);drawMiniPhoto(x,bg,ic,m,m,lw,118,2);drawMiniPhoto(x,bg,ic,m+lw+g,m,rw,rh,2);drawMiniPhoto(x,bg,ic,m+lw+g,m+rh+g,rw,118-rh-g,2);}
        else if(t.id==='brick'){const th=Math.floor((118-g)*.55),bh=118-g-th,bw=Math.floor((118-g)/2);drawMiniPhoto(x,bg,ic,m,m,120,th,2);drawMiniPhoto(x,bg,ic,m,m+th+g,bw,bh,2);drawMiniPhoto(x,bg,ic,m+bw+g,m+th+g,bw,bh,2);}
        else if(t.id==='dblpolaroid'){const cw=Math.floor((118-g)/2),ch=105;for(let i=0;i<2;i++){const cx=m+i*(cw+g);x.save();rR(x,cx,m,cw,ch,3);x.clip();x.fillStyle=dk?'#2A2520':'#F8F6F2';x.fillRect(cx,m,cw,ch);x.restore();drawMiniPhoto(x,bg,ic,cx+4,m+4,cw-8,ch-28,2);}}
        else if(t.id==='golden'){const lw=Math.floor((118-g)*.618),rw=118-g-lw,rh=Math.floor((118-g)/2);drawMiniPhoto(x,bg,ic,m,m,lw,118,2);drawMiniPhoto(x,bg,ic,m+lw+g,m,rw,rh,2);drawMiniPhoto(x,bg,ic,m+lw+g,m+rh+g,rw,118-rh-g,2);}
        else if(t.id==='pinboard'){const rotations=[-3,2,-1,3];const positions=[[m,m,55,70],[70,m+5,50,60],[m+10,75,50,45],[65,78,52,42]];for(let i=0;i<4;i++){const p=positions[i];x.save();x.translate(p[0]+p[2]/2,p[1]+p[3]/2);x.rotate(rotations[i]*Math.PI/180);drawMiniPhoto(x,bg,ic,-p[2]/2,-p[3]/2,p[2],p[3],2);x.restore();}}
    });
}

async function handleCap(){if(!stream||isCapturing)return;await multiShotCap();}
async function multiShotCap(){
    isCapturing=true;document.getElementById('btnCap').disabled=true;multiImgs=[];
    const tv=parseInt(document.getElementById('timerSlider').value),td=tplDefs.find(t=>t.id===selTpl),total=td.shots;
    for(let i=0;i<total;i++){
        document.getElementById('capTxt').textContent=`${i+1} / ${total}`;

        dTxt(x,cx+cW/2,cy+pad+photoH+botPad/2,cW-pad*2,dk,Math.round(botPad*.4));
    }
    dDt(x,w-mS-20,h-mB*.5,dk,Math.round(mB*.3));dWM(x,w,h);return c.toDataURL('image/png');
}

/* --- GOLDEN RATIO --- */
function asmGolden(imgs){
    const sw=imgs[0].width,sh=imgs[0].height,gap=Math.round(sw*.012),mS=Math.round(sw*.02),mT=Math.round(sh*.025),mB=Math.round(sh*.09);
    const cr=Math.min(gFD()?.cr||8,4);
    const lW=Math.floor((sw-gap)*.618),rW=sw-gap-lW,rH=Math.floor((sh-gap)/2);
    const w=sw+mS*2,h=sh+mT+mB;
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    drawCardStyle(x,w,h,selFrame);const dk=gFD()?.dark;
    dPhoto(x,imgs[0],mS,mT,lW,sh,cr);
    dPhoto(x,imgs[1],mS+lW+gap,mT,rW,rH,cr);
    dPhoto(x,imgs[2],mS+lW+gap,mT+rH+gap,rW,sh-rH-gap,cr);
    const taY=mT+sh+mB*.4;dTxt(x,w/2,taY,w-40,dk,Math.round(mB*.45));
    dDt(x,w/2,taY+mB*.3,dk,Math.round(sh*.02));dWM(x,w,h);return c.toDataURL('image/png');
}

/* --- PINBOARD --- */
function asmPinboard(imgs){
    const sw=imgs[0].width,sh=imgs[0].height,mS=Math.round(sw*.03),mT=Math.round(sh*.03),mB=Math.round(sh*.1);
    const w=sw+mS*2,h=sh+mT+mB;
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
    drawCardStyle(x,w,h,selFrame);const dk=gFD()?.dark;
    const areaW=sw,areaH=sh;
    const rots=[-2.5,1.8,-1.2,2.8];
    const rects=[
        [0,0,Math.round(areaW*.48),Math.round(areaH*.58)],
        [Math.round(areaW*.5),0,Math.round(areaW*.46),Math.round(areaH*.5)],
        [Math.round(areaW*.05),Math.round(areaH*.58),Math.round(areaW*.44),Math.round(areaH*.38)],
        [Math.round(areaW*.48),Math.round(areaH*.5),Math.round(areaW*.48),Math.round(areaH*.46)],
    ];
    for(let i=0;i<4;i++){
        const r=rects[i];const cx=mS+r[0]+r[2]/2,cy=mT+r[1]+r[3]/2;
        x.save();x.translate(cx,cy);x.rotate(rots[i]*Math.PI/180);
        dSh(x,-r[2]/2,-r[3]/2,r[2],r[3],4);
        x.save();rR(x,-r[2]/2,-r[3]/2,r[2],r[3],4);x.clip();x.drawImage(imgs[i],-r[2]/2,-r[3]/2,r[2],r[3]);x.restore();
        /* Pin di atas foto */
        x.beginPath();x.arc(0,-r[3]/2+8,4,0,Math.PI*2);x.fillStyle=dk?'rgba(255,255,255,.6)':'rgba(242,139,158,.7)';x.fill();
        x.strokeStyle=dk?'rgba(255,255,255,.3)':'rgba(200,100,120,.3)';x.lineWidth=1;x.stroke();
        x.restore();
    }
    const taY=mT+sh+mB*.4;dTxt(x,w/2,taY,w-40,dk,Math.round(mB*.45));
    dDt(x,w/2,taY+mB*.3,dk,Math.round(sh*.02));dWM(x,w,h);return c.toDataURL('image/png');
}

/* ====== GALLERY ====== */
function updateGal(){
    document.getElementById('galSec').style.display='';const g=document.getElementById('galGrid');g.innerHTML='';
    photos.forEach((p,i)=>{
        const it=document.createElement('div');it.className='gal-item';
        it.innerHTML=`<img src="${p.url}" alt="Foto ${i+1}" loading="lazy"><div class="gal-acts"><button class="g-dl" onclick="event.stopPropagation();dlPh(${i})" aria-label="Download"><i class="fa-solid fa-download"></i></button><button class="g-del" onclick="event.stopPropagation();delPh(${i})" aria-label="Hapus"><i class="fa-solid fa-trash"></i></button></div>`;
        it.querySelector('img').onclick=()=>openModal(p.url);g.appendChild(it);
    });
}
function dlPh(i){const a=document.createElement('a');a.href=photos[i].url;a.download=`ponyo-booth-${Date.now()}.png`;a.click();showToast('Foto didownload!','fa-solid fa-download');}
function delPh(i){photos.splice(i,1);updateGal();if(!photos.length)document.getElementById('galSec').style.display='none';showToast('Foto dihapus','fa-solid fa-trash');}

/* ====== MODAL ====== */
function openModal(src){document.getElementById('modalImg').src=src;document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');}
function dlModal(){const a=document.createElement('a');a.href=document.getElementById('modalImg').src;a.download=`ponyo-booth-${Date.now()}.png`;a.click();}
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});

/* ====== TOAST ====== */
function showToast(msg,icon){const t=document.createElement('div');t.className='toast';t.innerHTML=`<i class="${icon}" style="color:var(--accent4)"></i> ${msg}`;document.getElementById('toastBox').appendChild(t);setTimeout(()=>t.remove(),3000);}

/* ====== CONFETTI ====== */
const cCvs=document.getElementById('confettiCanvas'),cCtx=cCvs.getContext('2d');let cP=[],cR=false;
function rCC(){cCvs.width=innerWidth;cCvs.height=innerHeight;}
addEventListener('resize',rCC);rCC();
function launchConfetti(){cP=[];const cs=['#F28B9E','#F7B267','#8ECAE6','#A8D8B9','#F5A0B5','#D4C4F0','#FFD4D4'];for(let i=0;i<70;i++)cP.push({x:Math.random()*cCvs.width,y:Math.random()*cCvs.height-cCvs.height,w:Math.random()*8+4,h:Math.random()*5+2,c:cs[i%cs.length],vx:(Math.random()-.5)*3,vy:Math.random()*2.5+1.5,r:Math.random()*360,rs:(Math.random()-.5)*8,o:1});if(!cR){cR=true;aC();}}
function aC(){cCtx.clearRect(0,0,cCvs.width,cCvs.height);let alive=false;cP.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.rs;p.vy+=.04;if(p.y>cCvs.height-40)p.o-=.02;if(p.o>0){alive=true;cCtx.save();cCtx.globalAlpha=Math.max(0,p.o);cCtx.translate(p.x,p.y);cCtx.rotate(p.r*Math.PI/180);cCtx.fillStyle=p.c;cCtx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cCtx.restore();}});if(alive)requestAnimationFrame(aC);else{cR=false;cCtx.clearRect(0,0,cCvs.width,cCvs.height);}}

/* ====== KEYBOARD ====== */
document.addEventListener('keydown',e=>{if(e.code==='Space'&&stream&&!isCapturing){e.preventDefault();handleCap();}if(e.code==='Escape')closeModal();});

/* ====== INIT ====== */
initFlGrid();buildFrameScroll();buildTplGrid();buildFontScroll();updTimerLbl();
</script>
